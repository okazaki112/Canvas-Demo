<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>真实沙漏计时器 (2分钟)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            display: block;
        }
        .ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: white;
            pointer-events: none;
        }
        .time-display {
            font-size: 48px;
            font-weight: 300;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
            margin-bottom: 10px;
        }
        .progress-bar {
            width: 300px;
            height: 6px;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            overflow: hidden;
            margin: 0 auto;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            transition: width 0.1s linear;
            box-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        }
        .controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }
        .btn {
            padding: 12px 30px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            cursor: pointer;
            border-radius: 25px;
            font-size: 14px;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }
        .btn:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        .info {
            position: absolute;
            top: 120px;
            left: 20px;
            color: rgba(255,255,255,0.5);
            font-size: 12px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="ui">
        <div class="time-display" id="timeDisplay">02:00</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 100%"></div>
        </div>
    </div>
    <div class="info">点击沙漏翻转 | 鼠标扰动沙粒</div>
    <div class="controls">
        <button class="btn" onclick="flipHourglass()">翻转沙漏</button>
        <button class="btn" onclick="resetHourglass()">重置</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height, centerX, centerY;
        let particles = [];
        let fallingParticles = []; // 正在下落的粒子
        let mouseX = 0, mouseY = 0;
        let time = 0;
        
        // 沙漏配置
        const TOTAL_TIME = 120; // 2分钟 = 120秒
        const TOTAL_PARTICLES = 3000; // 总沙粒数
        const HOURGLASS_WIDTH = 140;
        const HOURGLASS_HEIGHT = 200;
        const NECK_WIDTH = 8;
        
        // 状态
        let flipped = false;
        let flipAngle = 0;
        let targetFlipAngle = 0;
        let isRunning = true;
        let remainingTime = TOTAL_TIME;
        let lastTime = Date.now();
        let particleFlowRate = TOTAL_PARTICLES / (TOTAL_TIME * 60); // 每帧流出的粒子数
        let accumulatedFlow = 0;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
        }
        
        // 沙粒类
        class SandParticle {
            constructor(x, y, isInTop = true) {
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.size = 1.5 + Math.random() * 1.5;
                // 沙粒颜色变化
                const hue = 30 + Math.random() * 15;
                const sat = 60 + Math.random() * 20;
                const light = 45 + Math.random() * 25;
                this.color = `hsl(${hue}, ${sat}%, ${light}%)`;
                this.isInTop = isInTop;
                this.isFalling = false;
                this.settled = false;
                this.settleY = 0;
            }
            
            update() {
                if (this.settled) return;
                
                // 应用重力
                if (this.isFalling) {
                    this.vy += 0.5;
                    this.vx *= 0.99;
                    this.vy *= 0.99;
                    
                    this.x += this.vx;
                    this.y += this.vy;
                    
                    // 鼠标扰动
                    const dx = this.x - mouseX;
                    const dy = this.y - mouseY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 80 && dist > 0) {
                        const force = (80 - dist) / 80 * 2;
                        this.vx += (dx / dist) * force;
                        this.vy += (dy / dist) * force;
                    }
                    
                    this.checkBoundaries();
                } else {
                    // 在容器内的微小扰动
                    this.x += (Math.random() - 0.5) * 0.1;
                    this.y += (Math.random() - 0.5) * 0.1;
                }
            }
            
            checkBoundaries() {
                // 获取当前沙漏边界（考虑旋转）
                const cos = Math.cos(flipAngle);
                const sin = Math.sin(flipAngle);
                
                // 将粒子坐标转换到沙漏本地坐标系
                const localX = (this.x - centerX) * cos + (this.y - centerY) * sin;
                const localY = -(this.x - centerX) * sin + (this.y - centerY) * cos;
                
                // 计算当前高度对应的沙漏宽度
                let maxWidth;
                const absY = Math.abs(localY);
                
                if (absY < 15) {
                    maxWidth = NECK_WIDTH;
                } else {
                    const t = (absY - 15) / (HOURGLASS_HEIGHT - 15);
                    maxWidth = NECK_WIDTH + (HOURGLASS_WIDTH - NECK_WIDTH) * t;
                }
                
                // 水平边界
                if (Math.abs(localX) > maxWidth - this.size) {
                    const newLocalX = Math.sign(localX) * (maxWidth - this.size);
                    this.x = centerX + newLocalX * cos - localY * sin;
                    this.y = centerY + newLocalX * sin + localY * cos;
                    this.vx *= -0.3;
                }
                
                // 垂直边界（底部）
                if (localY > HOURGLASS_HEIGHT - this.size) {
                    this.y = centerY + (HOURGLASS_HEIGHT - this.size) * cos + localX * sin;
                    this.vy = 0;
                    this.vx *= 0.5;
                    this.settled = true;
                    this.settleY = this.y;
                }
                
                // 穿过颈部检测
                if (Math.abs(localY) < 15 && Math.abs(localX) < NECK_WIDTH) {
                    // 成功穿过颈部，继续下落
                }
            }
            
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                
                // 高光
                if (this.size > 2) {
                    ctx.beginPath();
                    ctx.arc(this.x - this.size * 0.3, this.y - this.size * 0.3, this.size * 0.3, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                    ctx.fill();
                }
            }
        }
        
        // 初始化沙粒
        function initParticles() {
            particles = [];
            fallingParticles = [];
            
            // 在上半部分填充沙粒
            let attempts = 0;
            while (particles.length < TOTAL_PARTICLES && attempts < TOTAL_PARTICLES * 3) {
                attempts++;
                
                // 在沙漏上半部分随机生成
                const angle = Math.random() * Math.PI * 2;
                const r = Math.random() * (HOURGLASS_WIDTH - 10);
                const x = centerX + Math.cos(angle) * r;
                const y = centerY - 20 - Math.random() * (HOURGLASS_HEIGHT - 40);
                
                // 检查是否在有效区域内
                const localY = y - centerY;
                let maxWidth;
                const absY = Math.abs(localY);
                
                if (absY < 15) {
                    maxWidth = NECK_WIDTH;
                } else {
                    const t = (absY - 15) / (HOURGLASS_HEIGHT - 15);
                    maxWidth = NECK_WIDTH + (HOURGLASS_WIDTH - NECK_WIDTH) * t;
                }
                
                const localX = x - centerX;
                if (Math.abs(localX) < maxWidth - 5 && localY < 0) {
                    particles.push(new SandParticle(x, y, true));
                }
            }
        }
        
        // 绘制沙漏框架
        function drawHourglass() {
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(flipAngle);
            
            // 外框路径
            ctx.beginPath();
            ctx.moveTo(-HOURGLASS_WIDTH, -HOURGLASS_HEIGHT);
            ctx.lineTo(HOURGLASS_WIDTH, -HOURGLASS_HEIGHT);
            ctx.bezierCurveTo(NECK_WIDTH, -HOURGLASS_HEIGHT * 0.3, NECK_WIDTH, -10, 0, 0);
            ctx.bezierCurveTo(-NECK_WIDTH, -10, -NECK_WIDTH, -HOURGLASS_HEIGHT * 0.3, -HOURGLASS_WIDTH, -HOURGLASS_HEIGHT);
            
            ctx.moveTo(-HOURGLASS_WIDTH, HOURGLASS_HEIGHT);
            ctx.lineTo(HOURGLASS_WIDTH, HOURGLASS_HEIGHT);
            ctx.bezierCurveTo(NECK_WIDTH, HOURGLASS_HEIGHT * 0.3, NECK_WIDTH, 10, 0, 0);
            ctx.bezierCurveTo(-NECK_WIDTH, 10, -NECK_WIDTH, HOURGLASS_HEIGHT * 0.3, -HOURGLASS_WIDTH, HOURGLASS_HEIGHT);
            
            // 玻璃效果
            const glassGradient = ctx.createLinearGradient(-HOURGLASS_WIDTH, -HOURGLASS_HEIGHT, HOURGLASS_WIDTH, HOURGLASS_HEIGHT);
            glassGradient.addColorStop(0, 'rgba(200, 220, 255, 0.15)');
            glassGradient.addColorStop(0.3, 'rgba(200, 220, 255, 0.05)');
            glassGradient.addColorStop(0.5, 'rgba(200, 220, 255, 0.02)');
            glassGradient.addColorStop(0.7, 'rgba(200, 220, 255, 0.05)');
            glassGradient.addColorStop(1, 'rgba(200, 220, 255, 0.15)');
            
            ctx.fillStyle = glassGradient;
            ctx.fill();
            
            // 边框
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            // 高光
            ctx.beginPath();
            ctx.moveTo(-HOURGLASS_WIDTH + 10, -HOURGLASS_HEIGHT + 5);
            ctx.lineTo(-NECK_WIDTH, -5);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // 顶部和底部盖子
            ctx.fillStyle = 'rgba(100, 100, 120, 0.8)';
            ctx.fillRect(-HOURGLASS_WIDTH - 5, -HOURGLASS_HEIGHT - 8, HOURGLASS_WIDTH * 2 + 10, 8);
            ctx.fillRect(-HOURGLASS_WIDTH - 5, HOURGLASS_HEIGHT, HOURGLASS_WIDTH * 2 + 10, 8);
            
            ctx.restore();
        }
        
        // 更新计时
        function updateTimer() {
            if (!isRunning || remainingTime <= 0) return;
            
            const now = Date.now();
            const delta = (now - lastTime) / 1000;
            lastTime = now;
            
            remainingTime = Math.max(0, remainingTime - delta);
            
            // 更新显示
            const minutes = Math.floor(remainingTime / 60);
            const seconds = Math.floor(remainingTime % 60);
            document.getElementById('timeDisplay').textContent = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            document.getElementById('progressFill').style.width = `${(remainingTime / TOTAL_TIME) * 100}%`;
            
            // 计算需要流出的粒子数
            const flowThisFrame = particleFlowRate * (delta * 60);
            accumulatedFlow += flowThisFrame;
            
            while (accumulatedFlow >= 1 && particles.length > 0) {
                accumulatedFlow--;
                // 找到靠近颈部的粒子让它下落
                const neckParticle = particles.find(p => {
                    const dy = p.y - centerY;
                    return Math.abs(dy) < 30 && !p.isFalling;
                });
                
                if (neckParticle) {
                    neckParticle.isFalling = true;
                    fallingParticles.push(neckParticle);
                    particles = particles.filter(p => p !== neckParticle);
                } else if (particles.length > 0) {
                    // 随机让一个粒子下落
                    const randomIndex = Math.floor(Math.random() * Math.min(10, particles.length));
                    const p = particles[randomIndex];
                    if (p) {
                        p.isFalling = true;
                        p.vx = (Math.random() - 0.5) * 2;
                        p.vy = 2;
                        fallingParticles.push(p);
                        particles.splice(randomIndex, 1);
                    }
                }
            }
            
            if (remainingTime <= 0) {
                isRunning = false;
            }
        }
        
        // 翻转沙漏
        function flipHourglass() {
            if (Math.abs(flipAngle - targetFlipAngle) > 0.1) return;
            
            flipped = !flipped;
            targetFlipAngle = flipped ? Math.PI : 0;
            
            // 重置所有粒子状态
            [...particles, ...fallingParticles].forEach(p => {
                p.isFalling = false;
                p.settled = false;
                p.vx = 0;
                p.vy = 0;
            });
            
            // 交换上下粒子
            const allParticles = [...particles, ...fallingParticles];
            particles = allParticles;
            fallingParticles = [];
            
            // 重新计时
            remainingTime = TOTAL_TIME;
            isRunning = true;
            lastTime = Date.now();
            accumulatedFlow = 0;
        }
        
        // 重置沙漏
        function resetHourglass() {
            flipped = false;
            targetFlipAngle = 0;
            flipAngle = 0;
            remainingTime = TOTAL_TIME;
            isRunning = true;
            lastTime = Date.now();
            accumulatedFlow = 0;
            initParticles();
        }
        
        function animate() {
            time += 0.016;
            
            // 清空画布
            ctx.fillStyle = 'rgba(26, 26, 46, 0.3)';
            ctx.fillRect(0, 0, width, height);
            
            // 更新翻转动画
            flipAngle += (targetFlipAngle - flipAngle) * 0.08;
            
            // 更新计时器
            updateTimer();
            
            // 更新和绘制所有粒子
            [...particles, ...fallingParticles].forEach(p => {
                p.update();
                p.draw();
            });
            
            // 绘制沙漏框架（在粒子上方）
            drawHourglass();
            
            // 绘制沙流效果
            if (isRunning && remainingTime > 0) {
                const cos = Math.cos(flipAngle);
                const sin = Math.sin(flipAngle);
                
                // 颈部沙流
                const streamX = centerX;
                const streamY1 = centerY - 10;
                const streamY2 = centerY + 30;
                
                ctx.beginPath();
                ctx.moveTo(streamX - 3, streamY1);
                ctx.lineTo(streamX + 3, streamY1);
                ctx.lineTo(streamX + 2, streamY2);
                ctx.lineTo(streamX - 2, streamY2);
                ctx.closePath();
                
                const streamGradient = ctx.createLinearGradient(streamX, streamY1, streamX, streamY2);
                streamGradient.addColorStop(0, 'rgba(200, 180, 140, 0.8)');
                streamGradient.addColorStop(0.5, 'rgba(180, 160, 120, 0.6)');
                streamGradient.addColorStop(1, 'rgba(160, 140, 100, 0.4)');
                ctx.fillStyle = streamGradient;
                ctx.fill();
            }
            
            requestAnimationFrame(animate);
        }
        
        window.addEventListener('resize', resize);
        
        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });
        
        window.addEventListener('click', (e) => {
            // 检查是否点击在沙漏区域
            const dx = e.clientX - centerX;
            const dy = e.clientY - centerY;
            if (Math.abs(dx) < HOURGLASS_WIDTH && Math.abs(dy) < HOURGLASS_HEIGHT + 50) {
                flipHourglass();
            }
        });
        
        window.addEventListener('touchmove', (e) => {
            mouseX = e.touches[0].clientX;
            mouseY = e.touches[0].clientY;
        });
        
        window.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            const dx = touch.clientX - centerX;
            const dy = touch.clientY - centerY;
            if (Math.abs(dx) < HOURGLASS_WIDTH && Math.abs(dy) < HOURGLASS_HEIGHT + 50) {
                flipHourglass();
            }
        });
        
        resize();
        initParticles();
        animate();
    </script>
</body>
</html>
