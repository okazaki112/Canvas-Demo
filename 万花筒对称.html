<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>万花筒对称</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255,255,255,0.6);
            font-family: Arial, sans-serif;
            font-size: 14px;
            pointer-events: none;
        }
        .controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
        }
        .controls button {
            padding: 8px 16px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            cursor: pointer;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="info">移动鼠标绘制 | 滚轮调整对称轴数量</div>
    <div class="controls">
        <button onclick="clearCanvas()">清除</button>
        <button onclick="changeSymmetry()">对称: <span id="symCount">6</span></button>
        <button onclick="toggleAuto()">自动: <span id="autoStatus">开</span></button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height, centerX, centerY;
        let symmetry = 6;
        let autoDraw = true;
        let time = 0;
        let particles = [];
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
        }

        function clearCanvas() {
            ctx.fillStyle = 'rgba(0, 0, 0, 1)';
            ctx.fillRect(0, 0, width, height);
            particles = [];
        }

        function changeSymmetry() {
            symmetry = symmetry === 6 ? 8 : symmetry === 8 ? 12 : 6;
            document.getElementById('symCount').textContent = symmetry;
        }

        function toggleAuto() {
            autoDraw = !autoDraw;
            document.getElementById('autoStatus').textContent = autoDraw ? '开' : '关';
        }
        
        class Particle {
            constructor(x, y, hue) {
                this.x = x;
                this.y = y;
                this.hue = hue;
                this.life = 1;
                this.decay = 0.01;
                this.size = Math.random() * 15 + 5;
            }
            
            update() {
                this.life -= this.decay;
                this.size *= 0.98;
            }
            
            draw() {
                if (this.life <= 0) return;
                
                const alpha = this.life;
                
                // 绘制对称图形
                for (let i = 0; i < symmetry; i++) {
                    const angle = (Math.PI * 2 / symmetry) * i;
                    
                    ctx.save();
                    ctx.translate(centerX, centerY);
                    ctx.rotate(angle);
                    
                    // 镜像
                    ctx.save();
                    ctx.scale(1, -1);
                    this.drawShape(this.x - centerX, this.y - centerY, alpha);
                    ctx.restore();
                    
                    // 原图
                    this.drawShape(this.x - centerX, this.y - centerY, alpha);
                    
                    ctx.restore();
                }
            }
            
            drawShape(x, y, alpha) {
                const gradient = ctx.createRadialGradient(x, y, 0, x, y, this.size);
                gradient.addColorStop(0, `hsla(${this.hue}, 100%, 70%, ${alpha})`);
                gradient.addColorStop(0.5, `hsla(${this.hue + 30}, 100%, 50%, ${alpha * 0.5})`);
                gradient.addColorStop(1, `hsla(${this.hue + 60}, 100%, 30%, 0)`);
                
                ctx.beginPath();
                ctx.arc(x, y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();
            }
        }
        
        function drawKaleidoscope() {
            // 渐隐效果
            ctx.fillStyle = 'rgba(0, 0, 0, 0.02)';
            ctx.fillRect(0, 0, width, height);
            
            // 自动绘制
            if (autoDraw) {
                const t = time * 0.5;
                const x = centerX + Math.cos(t) * Math.sin(t * 2) * 200;
                const y = centerY + Math.sin(t * 1.5) * Math.cos(t * 0.7) * 200;
                const hue = (time * 30) % 360;
                
                particles.push(new Particle(x, y, hue));
            }
            
            // 更新和绘制粒子
            particles = particles.filter(p => {
                p.update();
                p.draw();
                return p.life > 0;
            });
        }
        
        function drawCenterDecoration() {
            const t = time * 2;
            
            for (let i = 0; i < symmetry; i++) {
                const angle = (Math.PI * 2 / symmetry) * i + t * 0.1;
                const r = 80 + Math.sin(t + i) * 20;
                
                const x = centerX + Math.cos(angle) * r;
                const y = centerY + Math.sin(angle) * r;
                
                ctx.beginPath();
                ctx.arc(x, y, 8, 0, Math.PI * 2);
                ctx.fillStyle = `hsl(${(time * 50 + i * 30) % 360}, 80%, 60%)`;
                ctx.fill();
            }
            
            // 中心圆
            ctx.beginPath();
            ctx.arc(centerX, centerY, 30 + Math.sin(t) * 5, 0, Math.PI * 2);
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 40);
            gradient.addColorStop(0, `hsl(${time * 30 % 360}, 100%, 70%)`);
            gradient.addColorStop(1, 'transparent');
            ctx.fillStyle = gradient;
            ctx.fill();
        }
        
        function animate() {
            time += 0.016;
            
            drawKaleidoscope();
            drawCenterDecoration();
            
            requestAnimationFrame(animate);
        }
        
        window.addEventListener('resize', resize);
        
        window.addEventListener('mousemove', (e) => {
            if (Math.random() < 0.3) {
                const hue = (Math.atan2(e.clientY - centerY, e.clientX - centerX) * 180 / Math.PI + 360) % 360;
                particles.push(new Particle(e.clientX, e.clientY, hue + time * 30));
            }
        });
        
        window.addEventListener('click', (e) => {
            for (let i = 0; i < 10; i++) {
                const hue = Math.random() * 360;
                particles.push(new Particle(e.clientX, e.clientY, hue));
            }
        });
        
        window.addEventListener('wheel', (e) => {
            if (e.deltaY > 0) {
                symmetry = Math.min(24, symmetry + 2);
            } else {
                symmetry = Math.max(2, symmetry - 2);
            }
            document.getElementById('symCount').textContent = symmetry;
        });
        
        window.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            if (Math.random() < 0.5) {
                const hue = (Math.atan2(touch.clientY - centerY, touch.clientX - centerX) * 180 / Math.PI + 360) % 360;
                particles.push(new Particle(touch.clientX, touch.clientY, hue + time * 30));
            }
        });
        
        resize();
        animate();
    </script>
</body>
</html>
