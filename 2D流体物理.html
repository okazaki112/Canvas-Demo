<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D流体物理</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            background: #0a0a1a;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        canvas { display: block; }
        .controls {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .controls button {
            padding: 8px 16px;
            border: 1px solid #333;
            background: rgba(0,0,0,0.8);
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .controls button:hover { background: #222; }
        .info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="controls">
        <button onclick="clearFluid()">清空流体</button>
        <button onclick="toggleGravity()">切换重力</button>
        <button onclick="changeColor()">切换颜色</button>
    </div>
    <div class="info">拖动鼠标生成水流，液体受重力流淌</div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        let gravity = 0.2;
        let colorHue = 200;
        let mouse = { x: 0, y: 0, down: false };
        
        const PARTICLE_COUNT = 1500;
        const GRID_SIZE = 20;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        
        class FluidParticle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.size = Math.random() * 4 + 3;
                this.mass = this.size;
                this.life = 1;
            }
            
            update() {
                this.vy += gravity;
                this.vx *= 0.99;
                this.vy *= 0.99;
                
                this.x += this.vx;
                this.y += this.vy;
                
                if (this.x < this.size) {
                    this.x = this.size;
                    this.vx *= -0.5;
                }
                if (this.x > width - this.size) {
                    this.x = width - this.size;
                    this.vx *= -0.5;
                }
                if (this.y < this.size) {
                    this.y = this.size;
                    this.vy *= -0.5;
                }
                if (this.y > height - this.size) {
                    this.y = height - this.size;
                    this.vy *= -0.3;
                    this.vx *= 0.9;
                }
                
                for (let other of particles) {
                    if (other === this) continue;
                    const dx = other.x - this.x;
                    const dy = other.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const minDist = this.size + other.size;
                    
                    if (dist < minDist && dist > 0) {
                        const overlap = minDist - dist;
                        const nx = dx / dist;
                        const ny = dy / dist;
                        
                        this.x -= nx * overlap * 0.5;
                        this.y -= ny * overlap * 0.5;
                        other.x += nx * overlap * 0.5;
                        other.y += ny * overlap * 0.5;
                        
                        const dvx = this.vx - other.vx;
                        const dvy = this.vy - other.vy;
                        const dv = dvx * nx + dvy * ny;
                        
                        if (dv > 0) {
                            const impulse = dv * 0.5;
                            this.vx -= impulse * nx;
                            this.vy -= impulse * ny;
                            other.vx += impulse * nx;
                            other.vy += impulse * ny;
                        }
                    }
                }
            }
            
            draw() {
                const gradient = ctx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, this.size
                );
                gradient.addColorStop(0, `hsla(${colorHue}, 80%, 60%, 0.8)`);
                gradient.addColorStop(0.5, `hsla(${colorHue + 20}, 80%, 50%, 0.4)`);
                gradient.addColorStop(1, `hsla(${colorHue + 40}, 80%, 40%, 0)`);
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();
            }
        }
        
        function animate() {
            ctx.fillStyle = 'rgba(10, 10, 26, 0.3)';
            ctx.fillRect(0, 0, width, height);
            
            if (mouse.down) {
                for (let i = 0; i < 3; i++) {
                    if (particles.length < PARTICLE_COUNT) {
                        particles.push(new FluidParticle(
                            mouse.x + (Math.random() - 0.5) * 20,
                            mouse.y + (Math.random() - 0.5) * 20
                        ));
                    }
                }
            }
            
            for (let p of particles) {
                p.update();
                p.draw();
            }
            
            requestAnimationFrame(animate);
        }
        
        canvas.addEventListener('mousedown', e => {
            mouse.down = true;
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        
        canvas.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        
        canvas.addEventListener('mouseup', () => mouse.down = false);
        canvas.addEventListener('mouseleave', () => mouse.down = false);
        
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            mouse.down = true;
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        });
        
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        });
        
        canvas.addEventListener('touchend', () => mouse.down = false);
        
        function clearFluid() {
            particles = [];
        }
        
        function toggleGravity() {
            gravity = gravity === 0.2 ? -0.2 : 0.2;
        }
        
        function changeColor() {
            colorHue = (colorHue + 60) % 360;
        }
        
        window.addEventListener('resize', resize);
        resize();
        animate();
    </script>
</body>
</html>
