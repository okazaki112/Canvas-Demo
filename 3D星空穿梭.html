<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D星空穿梭</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255,255,255,0.6);
            font-family: Arial, sans-serif;
            font-size: 14px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="info">移动鼠标改变飞行方向 | 点击加速</div>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height, centerX, centerY;
        let stars = [];
        let speed = 2;
        let targetSpeed = 2;
        let mouseX = 0, mouseY = 0;
        let offsetX = 0, offsetY = 0;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
        }
        
        class Star {
            constructor() {
                this.reset();
            }
            
            reset() {
                this.x = (Math.random() - 0.5) * width * 2;
                this.y = (Math.random() - 0.5) * height * 2;
                this.z = Math.random() * 2000;
                this.pz = this.z;
                this.size = Math.random() * 2 + 0.5;
                this.hue = Math.random() * 60 + 200;
            }
            
            update() {
                this.z -= speed;
                this.pz = this.z + speed;
                
                if (this.z <= 0) {
                    this.reset();
                    this.z = 2000;
                    this.pz = 2000;
                }
            }
            
            draw() {
                const x = (this.x - offsetX) * (1000 / this.z) + centerX;
                const y = (this.y - offsetY) * (1000 / this.z) + centerY;
                const px = (this.x - offsetX) * (1000 / this.pz) + centerX;
                const py = (this.y - offsetY) * (1000 / this.pz) + centerY;
                
                if (x < 0 || x > width || y < 0 || y > height) return;
                
                const size = (1 - this.z / 2000) * this.size * 3;
                const alpha = 1 - this.z / 2000;
                
                // 绘制拖尾
                const gradient = ctx.createLinearGradient(px, py, x, y);
                gradient.addColorStop(0, `hsla(${this.hue}, 80%, 70%, 0)`);
                gradient.addColorStop(1, `hsla(${this.hue}, 80%, 70%, ${alpha})`);
                
                ctx.beginPath();
                ctx.moveTo(px, py);
                ctx.lineTo(x, y);
                ctx.strokeStyle = gradient;
                ctx.lineWidth = size;
                ctx.stroke();
                
                // 绘制星点
                ctx.beginPath();
                ctx.arc(x, y, size * 0.8, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${this.hue}, 80%, 90%, ${alpha})`;
                ctx.fill();
                
                // 光晕
                if (size > 2) {
                    ctx.beginPath();
                    ctx.arc(x, y, size * 2, 0, Math.PI * 2);
                    const glow = ctx.createRadialGradient(x, y, 0, x, y, size * 2);
                    glow.addColorStop(0, `hsla(${this.hue}, 80%, 70%, ${alpha * 0.5})`);
                    glow.addColorStop(1, `hsla(${this.hue}, 80%, 70%, 0)`);
                    ctx.fillStyle = glow;
                    ctx.fill();
                }
            }
        }
        
        function init() {
            resize();
            stars = [];
            for (let i = 0; i < 800; i++) {
                stars.push(new Star());
            }
        }
        
        function animate() {
            // 渐隐效果
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(0, 0, width, height);
            
            // 平滑速度变化
            speed += (targetSpeed - speed) * 0.05;
            
            // 计算偏移
            offsetX += (mouseX - offsetX) * 0.05;
            offsetY += (mouseY - offsetY) * 0.05;
            
            // 绘制星星
            stars.forEach(star => {
                star.update();
                star.draw();
            });
            
            requestAnimationFrame(animate);
        }
        
        window.addEventListener('resize', resize);
        
        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX - centerX) * 2;
            mouseY = (e.clientY - centerY) * 2;
        });
        
        window.addEventListener('mousedown', () => {
            targetSpeed = 20;
        });
        
        window.addEventListener('mouseup', () => {
            targetSpeed = 2;
        });
        
        window.addEventListener('touchstart', () => {
            targetSpeed = 20;
        });
        
        window.addEventListener('touchend', () => {
            targetSpeed = 2;
        });
        
        window.addEventListener('touchmove', (e) => {
            mouseX = (e.touches[0].clientX - centerX) * 2;
            mouseY = (e.touches[0].clientY - centerY) * 2;
        });
        
        init();
        animate();
    </script>
</body>
</html>
