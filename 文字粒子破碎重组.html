<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文字粒子破碎重组</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            background: #0a0a0a;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        canvas { display: block; }
        .controls {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10;
        }
        .controls input {
            padding: 10px 15px;
            font-size: 16px;
            border: 2px solid #333;
            background: rgba(0,0,0,0.8);
            color: #fff;
            border-radius: 8px;
            outline: none;
            width: 200px;
        }
        .controls input:focus { border-color: #00d4ff; }
        .hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="controls">
        <input type="text" id="textInput" value="CANVAS" placeholder="输入文字">
    </div>
    <div class="hint">鼠标划过文字，粒子会破碎散开</div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const textInput = document.getElementById('textInput');
        
        let width, height;
        let particles = [];
        let mouse = { x: -1000, y: -1000 };
        let currentText = 'CANVAS';
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            createTextParticles(currentText);
        }
        
        class Particle {
            constructor(targetX, targetY) {
                this.targetX = targetX;
                this.targetY = targetY;
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = 0;
                this.vy = 0;
                this.size = Math.random() * 2 + 1;
                this.hue = Math.random() * 60 + 300;
                this.friction = 0.95;
                this.ease = 0.08;
                this.exploded = false;
            }
            
            update() {
                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 80) {
                    this.exploded = true;
                    const force = (80 - dist) / 80;
                    const angle = Math.atan2(dy, dx);
                    this.vx -= Math.cos(angle) * force * 15;
                    this.vy -= Math.sin(angle) * force * 15;
                }

                if (this.exploded && dist > 100) {
                    this.exploded = false;
                }

                const waveOffset = Math.sin(Date.now() * 0.002 + this.targetX * 0.01) * 5;
                const targetYWithWave = this.targetY + waveOffset;

                const ax = (this.targetX - this.x) * this.ease;
                const ay = (targetYWithWave - this.y) * this.ease;

                this.vx += ax;
                this.vy += ay;
                this.vx *= this.friction;
                this.vy *= this.friction;

                this.x += this.vx;
                this.y += this.vy;
            }
            
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `hsl(${this.hue}, 80%, 60%)`;
                ctx.fill();
            }
        }
        
        function createTextParticles(text) {
            particles = [];
            ctx.clearRect(0, 0, width, height);
            
            const fontSize = Math.min(width / text.length * 1.2, 150);
            ctx.font = `bold ${fontSize}px Microsoft YaHei`;
            ctx.fillStyle = '#fff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, width / 2, height / 2);
            
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;
            const step = 4;
            
            for (let y = 0; y < height; y += step) {
                for (let x = 0; x < width; x += step) {
                    const index = (y * width + x) * 4;
                    if (data[index + 3] > 128) {
                        particles.push(new Particle(x, y));
                    }
                }
            }
            
            ctx.clearRect(0, 0, width, height);
        }
        
        function animate() {
            ctx.fillStyle = 'rgba(10, 10, 10, 0.2)';
            ctx.fillRect(0, 0, width, height);
            
            for (let p of particles) {
                p.update();
                p.draw();
            }
            
            requestAnimationFrame(animate);
        }
        
        canvas.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        
        textInput.addEventListener('change', e => {
            currentText = e.target.value || 'CANVAS';
            createTextParticles(currentText);
        });
        
        window.addEventListener('resize', resize);
        resize();
        animate();
    </script>
</body>
</html>
