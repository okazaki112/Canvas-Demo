<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>下雨玻璃窗</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255,255,255,0.6);
            font-family: Arial, sans-serif;
            font-size: 14px;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="info">移动鼠标产生更多雨滴 | 点击产生大雨</div>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let drops = [];
        let trails = [];
        let mouseX = 0, mouseY = 0;
        let isRaining = false;
        let rainIntensity = 1;
        
        // 背景城市灯光颜色
        const cityColors = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#95e1d3', '#a8e6cf', '#ff8b94'];
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        
        class RainDrop {
            constructor(x, y, size = null) {
                this.x = x || Math.random() * width;
                this.y = y || -20;
                this.size = size || Math.random() * 3 + 2;
                this.speed = Math.random() * 2 + 3;
                this.merging = false;
                this.targetSize = this.size;
                this.opacity = Math.random() * 0.3 + 0.4;
                this.wobble = Math.random() * Math.PI * 2;
                this.wobbleSpeed = Math.random() * 0.1 + 0.05;
            }
            
            update() {
                this.y += this.speed;
                this.wobble += this.wobbleSpeed;
                this.x += Math.sin(this.wobble) * 0.5;
                
                // 重力加速
                this.speed += 0.1;
                
                // 合并动画
                if (this.size < this.targetSize) {
                    this.size += 0.2;
                }
                
                // 当雨滴到达底部时形成水痕
                if (this.y > height - 50 && Math.random() < 0.3) {
                    trails.push(new WaterTrail(this.x, height - 50 + Math.random() * 50, this.size));
                }
                
                return this.y < height + 20;
            }
            
            draw() {
                // 雨滴主体 - 使用椭圆形状
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(Math.sin(this.wobble) * 0.2);
                
                // 水滴形状
                ctx.beginPath();
                ctx.ellipse(0, 0, this.size * 0.6, this.size, 0, 0, Math.PI * 2);
                
                // 渐变填充
                const gradient = ctx.createRadialGradient(
                    -this.size * 0.2, -this.size * 0.3, 0,
                    0, 0, this.size
                );
                gradient.addColorStop(0, `rgba(200, 220, 255, ${this.opacity + 0.3})`);
                gradient.addColorStop(0.5, `rgba(150, 180, 220, ${this.opacity})`);
                gradient.addColorStop(1, `rgba(100, 130, 180, ${this.opacity * 0.5})`);
                ctx.fillStyle = gradient;
                ctx.fill();
                
                // 高光
                ctx.beginPath();
                ctx.ellipse(-this.size * 0.2, -this.size * 0.3, this.size * 0.2, this.size * 0.3, -0.3, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity * 0.8})`;
                ctx.fill();
                
                ctx.restore();
            }
            
            checkMerge(other) {
                const dx = this.x - other.x;
                const dy = this.y - other.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < this.size + other.size && !this.merging && !other.merging) {
                    if (this.size >= other.size) {
                        this.targetSize = Math.min(this.size + other.size * 0.5, 15);
                        this.merging = true;
                        return other;
                    }
                }
                return null;
            }
        }
        
        class WaterTrail {
            constructor(x, y, size) {
                this.x = x;
                this.y = y;
                this.size = size * 0.5;
                this.life = 1;
                this.decay = Math.random() * 0.01 + 0.005;
                this.speed = Math.random() * 0.5 + 0.2;
                this.path = [{x, y}];
            }
            
            update() {
                this.y += this.speed;
                this.life -= this.decay;
                this.speed += 0.02;
                
                // 随机左右摆动
                this.x += (Math.random() - 0.5) * 2;
                
                // 记录路径
                if (Math.random() < 0.3) {
                    this.path.push({x: this.x, y: this.y});
                    if (this.path.length > 10) this.path.shift();
                }
                
                return this.life > 0 && this.y < height;
            }
            
            draw() {
                if (this.path.length < 2) return;
                
                ctx.beginPath();
                ctx.moveTo(this.path[0].x, this.path[0].y);
                for (let i = 1; i < this.path.length; i++) {
                    ctx.lineTo(this.path[i].x, this.path[i].y);
                }
                
                ctx.strokeStyle = `rgba(180, 200, 230, ${this.life * 0.4})`;
                ctx.lineWidth = this.size * this.life;
                ctx.lineCap = 'round';
                ctx.stroke();
            }
        }
        
        function drawBackground() {
            // 模糊的城市夜景背景
            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, '#0d1b2a');
            gradient.addColorStop(0.5, '#1b263b');
            gradient.addColorStop(1, '#0d1b2a');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);
            
            // 绘制模糊的城市灯光
            for (let i = 0; i < 20; i++) {
                const x = (i / 20) * width + Math.sin(Date.now() * 0.001 + i) * 20;
                const y = height * 0.3 + Math.cos(Date.now() * 0.0015 + i * 0.5) * 50;
                const size = 30 + Math.sin(Date.now() * 0.002 + i) * 10;
                
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                const color = cityColors[i % cityColors.length];
                const gradient = ctx.createRadialGradient(x, y, 0, x, y, size * 2);
                gradient.addColorStop(0, color + '40');
                gradient.addColorStop(1, 'transparent');
                ctx.fillStyle = gradient;
                ctx.fill();
            }
            
            // 添加整体模糊效果
            ctx.fillStyle = 'rgba(20, 30, 50, 0.3)';
            ctx.fillRect(0, 0, width, height);
        }
        
        function drawWindowFrame() {
            // 窗框
            ctx.strokeStyle = 'rgba(60, 70, 90, 0.8)';
            ctx.lineWidth = 8;
            
            // 外框
            ctx.strokeRect(20, 20, width - 40, height - 40);
            
            // 十字窗格
            ctx.beginPath();
            ctx.moveTo(width / 2, 20);
            ctx.lineTo(width / 2, height - 20);
            ctx.moveTo(20, height / 2);
            ctx.lineTo(width - 20, height / 2);
            ctx.stroke();
            
            // 窗框高光
            ctx.strokeStyle = 'rgba(100, 110, 130, 0.3)';
            ctx.lineWidth = 2;
            ctx.strokeRect(24, 24, width - 48, height - 48);
        }
        
        function init() {
            resize();
            drops = [];
            trails = [];
        }
        
        function animate() {
            drawBackground();
            
            // 生成新雨滴
            const spawnRate = isRaining ? 0.8 * rainIntensity : 0.15 * rainIntensity;
            if (Math.random() < spawnRate) {
                const numDrops = isRaining ? Math.floor(Math.random() * 5) + 3 : 1;
                for (let i = 0; i < numDrops; i++) {
                    drops.push(new RainDrop());
                }
            }
            
            // 鼠标附近生成雨滴
            if (Math.random() < 0.3) {
                drops.push(new RainDrop(
                    mouseX + (Math.random() - 0.5) * 100,
                    mouseY + (Math.random() - 0.5) * 50,
                    Math.random() * 2 + 1
                ));
            }
            
            // 更新和绘制水痕
            trails = trails.filter(trail => {
                trail.update();
                trail.draw();
                return trail.life > 0;
            });
            
            // 检查雨滴合并
            for (let i = drops.length - 1; i >= 0; i--) {
                for (let j = i - 1; j >= 0; j--) {
                    const merged = drops[i].checkMerge(drops[j]);
                    if (merged) {
                        drops.splice(j, 1);
                        i--;
                        break;
                    }
                }
            }
            
            // 更新和绘制雨滴
            drops = drops.filter(drop => {
                const alive = drop.update();
                if (alive) drop.draw();
                return alive;
            });
            
            // 绘制窗框
            drawWindowFrame();
            
            // 玻璃反光效果
            const glassGradient = ctx.createLinearGradient(0, 0, width, height);
            glassGradient.addColorStop(0, 'rgba(255, 255, 255, 0.03)');
            glassGradient.addColorStop(0.5, 'rgba(255, 255, 255, 0)');
            glassGradient.addColorStop(1, 'rgba(255, 255, 255, 0.02)');
            ctx.fillStyle = glassGradient;
            ctx.fillRect(0, 0, width, height);
            
            requestAnimationFrame(animate);
        }
        
        window.addEventListener('resize', resize);
        
        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });
        
        window.addEventListener('mousedown', () => {
            isRaining = true;
            rainIntensity = 3;
        });
        
        window.addEventListener('mouseup', () => {
            isRaining = false;
            rainIntensity = 1;
        });
        
        window.addEventListener('touchmove', (e) => {
            mouseX = e.touches[0].clientX;
            mouseY = e.touches[0].clientY;
        });
        
        window.addEventListener('touchstart', () => {
            isRaining = true;
            rainIntensity = 3;
        });
        
        window.addEventListener('touchend', () => {
            isRaining = false;
            rainIntensity = 1;
        });
        
        init();
        animate();
    </script>
</body>
</html>
