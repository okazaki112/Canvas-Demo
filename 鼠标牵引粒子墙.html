<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鼠标牵引粒子墙</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            background: #0a0a0a;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        canvas { display: block; }
        .info {
            position: fixed;
            top: 20px;
            left: 20px;
            color: rgba(255,255,255,0.7);
            font-size: 14px;
            pointer-events: none;
            z-index: 10;
        }
        .info h1 { font-size: 18px; margin-bottom: 8px; color: #fff; }
    </style>
</head>
<body>
    <div class="info">
        <h1>鼠标牵引粒子墙</h1>
        <p>移动鼠标吸附粒子，松开回弹</p>
    </div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        let mouse = { x: -1000, y: -1000, active: false };
        let mouseTrail = [];
        const TRAIL_LENGTH = 20;
        
        const PARTICLE_COUNT = 2500;
        const MOUSE_RADIUS = 150;
        const SPRING_STRENGTH = 0.03;
        const FRICTION = 0.9;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initParticles();
        }
        
        class Particle {
            constructor(x, y) {
                this.originX = x;
                this.originY = y;
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.size = Math.random() * 2 + 1;
                this.color = `hsl(${Math.random() * 60 + 180}, 80%, 60%)`;
            }
            
            update() {
                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (mouse.active && dist < MOUSE_RADIUS) {
                    const force = (MOUSE_RADIUS - dist) / MOUSE_RADIUS;
                    const angle = Math.atan2(dy, dx);
                    this.vx += Math.cos(angle) * force * 2;
                    this.vy += Math.sin(angle) * force * 2;
                }
                
                const springX = (this.originX - this.x) * SPRING_STRENGTH;
                const springY = (this.originY - this.y) * SPRING_STRENGTH;
                
                this.vx += springX;
                this.vy += springY;
                this.vx *= FRICTION;
                this.vy *= FRICTION;
                
                this.x += this.vx;
                this.y += this.vy;
            }
            
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }
        
        function initParticles() {
            particles = [];
            const cols = Math.ceil(Math.sqrt(PARTICLE_COUNT * width / height));
            const rows = Math.ceil(PARTICLE_COUNT / cols);
            const spacingX = width / cols;
            const spacingY = height / rows;
            
            for (let i = 0; i < cols; i++) {
                for (let j = 0; j < rows; j++) {
                    if (particles.length >= PARTICLE_COUNT) break;
                    const x = i * spacingX + spacingX / 2 + (Math.random() - 0.5) * 10;
                    const y = j * spacingY + spacingY / 2 + (Math.random() - 0.5) * 10;
                    particles.push(new Particle(x, y));
                }
            }
        }
        
        function drawMouseTrail() {
            if (mouseTrail.length < 2) return;

            for (let i = 1; i < mouseTrail.length; i++) {
                const alpha = (i / mouseTrail.length) * 0.5;
                const width = (i / mouseTrail.length) * 4;

                ctx.beginPath();
                ctx.moveTo(mouseTrail[i - 1].x, mouseTrail[i - 1].y);
                ctx.lineTo(mouseTrail[i].x, mouseTrail[i].y);
                ctx.strokeStyle = `rgba(0, 212, 255, ${alpha})`;
                ctx.lineWidth = width;
                ctx.lineCap = 'round';
                ctx.stroke();
            }

            const last = mouseTrail[mouseTrail.length - 1];
            const gradient = ctx.createRadialGradient(last.x, last.y, 0, last.x, last.y, 30);
            gradient.addColorStop(0, 'rgba(0, 212, 255, 0.6)');
            gradient.addColorStop(0.5, 'rgba(0, 150, 255, 0.3)');
            gradient.addColorStop(1, 'rgba(0, 100, 255, 0)');
            ctx.beginPath();
            ctx.arc(last.x, last.y, 30, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();
        }

        function updateMouseTrail() {
            if (mouse.active) {
                mouseTrail.push({ x: mouse.x, y: mouse.y });
                if (mouseTrail.length > TRAIL_LENGTH) {
                    mouseTrail.shift();
                }
            } else {
                mouseTrail = [];
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(10, 10, 10, 0.3)';
            ctx.fillRect(0, 0, width, height);

            updateMouseTrail();
            drawMouseTrail();

            for (let p of particles) {
                p.update();
                p.draw();
            }

            requestAnimationFrame(animate);
        }
        
        canvas.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            mouse.active = true;
        });
        
        canvas.addEventListener('mouseleave', () => {
            mouse.active = false;
        });
        
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
            mouse.active = true;
        });
        
        canvas.addEventListener('touchend', () => {
            mouse.active = false;
        });
        
        window.addEventListener('resize', resize);
        resize();
        animate();
    </script>
</body>
</html>
