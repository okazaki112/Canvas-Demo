<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音频可视化频谱</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            background: #0a0a0a;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        canvas { display: block; }
        .controls {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .controls input[type="file"] {
            display: none;
        }
        .controls label, .controls button {
            padding: 10px 20px;
            border: 2px solid #333;
            background: rgba(0,0,0,0.8);
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .controls label:hover, .controls button:hover {
            border-color: #00d4ff;
        }
        .info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="controls">
        <label for="audioInput">上传音乐</label>
        <input type="file" id="audioInput" accept="audio/*">
        <button onclick="toggleDemo()">演示模式</button>
    </div>
    <div class="info">上传音乐或点击演示模式查看频谱效果</div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const audioInput = document.getElementById('audioInput');
        
        let width, height;
        let audioContext, analyser, source;
        let dataArray;
        let isDemo = false;
        let demoTime = 0;
        let spectrumParticles = [];
        let isPlaying = false;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        
        function initAudio(file) {
            // 清理之前的音频上下文
            if (audioContext) {
                audioContext.close();
            }
            
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 256;
            
            const reader = new FileReader();
            reader.onload = e => {
                audioContext.decodeAudioData(e.target.result, buffer => {
                    if (source) {
                        try { source.stop(); } catch(e) {}
                    }
                    
                    source = audioContext.createBufferSource();
                    source.buffer = buffer;
                    source.connect(analyser);
                    analyser.connect(audioContext.destination);
                    
                    // 音频结束时清理
                    source.onended = () => {
                        isPlaying = false;
                        if (audioContext && audioContext.state !== 'closed') {
                            audioContext.close();
                        }
                    };
                    
                    source.start(0);
                    isPlaying = true;
                    
                    const bufferLength = analyser.frequencyBinCount;
                    dataArray = new Uint8Array(bufferLength);
                }, error => {
                    console.error('音频解码失败:', error);
                    alert('无法解码音频文件，请尝试其他格式');
                });
            };
            reader.onerror = () => {
                alert('文件读取失败');
            };
            reader.readAsArrayBuffer(file);
        }
        
        function getDemoData() {
            demoTime += 0.05;
            const data = [];
            for (let i = 0; i < 128; i++) {
                const base = Math.sin(demoTime + i * 0.1) * 50 + 50;
                const beat = Math.sin(demoTime * 4) * 30 + 30;
                const noise = Math.random() * 20;
                data.push(Math.max(0, Math.min(255, base + beat + noise)));
            }
            return data;
        }
        
        function drawBar(x, barWidth, barHeight, hue) {
            const gradient = ctx.createLinearGradient(0, height, 0, height - barHeight);
            gradient.addColorStop(0, `hsla(${hue}, 100%, 50%, 0.8)`);
            gradient.addColorStop(0.5, `hsla(${hue + 30}, 100%, 60%, 0.9)`);
            gradient.addColorStop(1, `hsla(${hue + 60}, 100%, 70%, 1)`);
            
            ctx.fillStyle = gradient;
            ctx.fillRect(x, height - barHeight, barWidth - 2, barHeight);
            
            ctx.fillStyle = `hsla(${hue + 60}, 100%, 80%, 0.8)`;
            ctx.fillRect(x, height - barHeight - 5, barWidth - 2, 3);
        }
        
        function drawCircular(data, radius) {
            const centerX = width / 2;
            const centerY = height / 2;
            const barCount = Math.min(data.length, 64); // 限制数量提高性能
            const angleStep = (Math.PI * 2) / barCount;
            
            for (let i = 0; i < barCount; i++) {
                const value = data[i];
                const barHeight = (value / 255) * 200;
                const angle = i * angleStep - Math.PI / 2;
                const hue = (i / barCount) * 360;
                
                const x1 = centerX + Math.cos(angle) * radius;
                const y1 = centerY + Math.sin(angle) * radius;
                const x2 = centerX + Math.cos(angle) * (radius + barHeight);
                const y2 = centerY + Math.sin(angle) * (radius + barHeight);
                
                const gradient = ctx.createLinearGradient(x1, y1, x2, y2);
                gradient.addColorStop(0, `hsla(${hue}, 100%, 50%, 0.8)`);
                gradient.addColorStop(1, `hsla(${hue}, 100%, 70%, 1)`);
                
                ctx.strokeStyle = gradient;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
            }
        }
        
        class SpectrumParticle {
            constructor(x, y, hue, energy) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 8;
                this.vy = (Math.random() - 0.5) * 8;
                this.hue = hue;
                this.life = 1;
                this.decay = 0.02 + Math.random() * 0.02;
                this.size = energy * 6;
                this.energy = energy;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.95;
                this.vy *= 0.95;
                this.life -= this.decay;
            }

            draw() {
                const alpha = this.life * this.energy;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${this.hue}, 100%, 60%, ${alpha})`;
                ctx.fill();

                ctx.shadowBlur = 10;
                ctx.shadowColor = `hsla(${this.hue}, 100%, 60%, ${alpha * 0.5})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * this.life * 0.5, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${this.hue}, 100%, 80%, ${alpha})`;
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            isDead() {
                return this.life <= 0;
            }
        }

        function spawnSpectrumParticles(data) {
            const centerX = width / 2;
            const centerY = height / 2;

            // 限制粒子生成频率
            for (let i = 0; i < data.length; i += 8) {
                const value = data[i];
                if (value < 180) continue; // 提高阈值减少粒子

                const angle = (i / data.length) * Math.PI * 2;
                const dist = (value / 255) * 200;
                const x = centerX + Math.cos(angle) * dist;
                const y = centerY + Math.sin(angle) * dist;
                const hue = (i / data.length) * 360;
                const energy = value / 255;

                if (Math.random() < 0.15) { // 降低生成概率
                    spectrumParticles.push(new SpectrumParticle(x, y, hue, energy));
                }
            }
        }

        function drawParticles(data) {
            const centerX = width / 2;
            const centerY = height / 2;

            // 限制绘制数量
            for (let i = 0; i < data.length; i += 4) {
                const value = data[i];
                if (value < 120) continue;

                const angle = (i / data.length) * Math.PI * 2;
                const dist = (value / 255) * 300;
                const x = centerX + Math.cos(angle) * dist;
                const y = centerY + Math.sin(angle) * dist;
                const size = (value / 255) * 8;
                const hue = (i / data.length) * 360;

                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${hue}, 100%, 60%, ${value / 255})`;
                ctx.fill();
            }
        }
        
        let lastTime = 0;
        const targetFPS = 60;
        const frameInterval = 1000 / targetFPS;
        
        function animate(currentTime) {
            requestAnimationFrame(animate);
            
            // 帧率控制
            const deltaTime = currentTime - lastTime;
            if (deltaTime < frameInterval) return;
            lastTime = currentTime - (deltaTime % frameInterval);
            
            ctx.fillStyle = 'rgba(10, 10, 10, 0.3)';
            ctx.fillRect(0, 0, width, height);

            let data;
            if (analyser && dataArray && isPlaying) {
                analyser.getByteFrequencyData(dataArray);
                data = Array.from(dataArray);
            } else if (isDemo) {
                data = getDemoData();
            } else {
                return;
            }

            // 限制粒子数量
            if (spectrumParticles.length > 100) {
                spectrumParticles = spectrumParticles.slice(-100);
            }

            spawnSpectrumParticles(data);

            for (let p of spectrumParticles) {
                p.update();
                p.draw();
            }
            spectrumParticles = spectrumParticles.filter(p => !p.isDead());

            const barWidth = width / data.length;
            for (let i = 0; i < data.length; i++) {
                const barHeight = (data[i] / 255) * height * 0.8;
                const hue = (i / data.length) * 360;
                drawBar(i * barWidth, barWidth, barHeight, hue);
            }

            drawCircular(data, 100);
            drawParticles(data);
        }
        
        audioInput.addEventListener('change', e => {
            const file = e.target.files[0];
            if (file) {
                isDemo = false;
                initAudio(file);
            }
        });
        
        function toggleDemo() {
            isDemo = !isDemo;
            if (source) {
                try { source.stop(); } catch(e) {}
            }
            isPlaying = false;
        }
        
        window.addEventListener('resize', resize);
        resize();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
