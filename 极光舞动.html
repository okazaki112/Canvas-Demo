<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极光舞动</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255,255,255,0.5);
            font-family: Arial, sans-serif;
            font-size: 14px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="info">移动鼠标影响极光 | 点击改变颜色</div>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let auroras = [];
        let stars = [];
        let mouseX = 0, mouseY = 0;
        let time = 0;
        let colorShift = 0;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initStars();
        }
        
        class Star {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height * 0.6;
                this.size = Math.random() * 1.5;
                this.alpha = Math.random();
                this.twinkleSpeed = Math.random() * 0.02 + 0.01;
            }
            
            update() {
                this.alpha += this.twinkleSpeed;
                if (this.alpha > 1 || this.alpha < 0.3) {
                    this.twinkleSpeed = -this.twinkleSpeed;
                }
            }
            
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.fill();
            }
        }
        
        class Aurora {
            constructor(index, total) {
                this.index = index;
                this.total = total;
                this.points = [];
                this.numPoints = 50;
                this.baseY = height * (0.2 + index * 0.15);
                this.hueOffset = index * 30;
                this.initPoints();
            }
            
            initPoints() {
                this.points = [];
                for (let i = 0; i <= this.numPoints; i++) {
                    this.points.push({
                        x: (width / this.numPoints) * i,
                        y: 0,
                        baseY: 0,
                        phase: Math.random() * Math.PI * 2
                    });
                }
            }
            
            update() {
                const t = time * 0.5;
                
                for (let i = 0; i < this.points.length; i++) {
                    const point = this.points[i];
                    const xRatio = i / this.numPoints;
                    
                    // 多层正弦波叠加产生自然波动
                    const wave1 = Math.sin(t + xRatio * 3 + this.index) * 30;
                    const wave2 = Math.sin(t * 1.5 + xRatio * 5 + this.index * 0.5) * 20;
                    const wave3 = Math.sin(t * 0.7 + xRatio * 8) * 15;
                    
                    // 鼠标影响
                    const dx = point.x - mouseX;
                    const mouseInfluence = Math.max(0, 1 - Math.abs(dx) / 200) * (mouseY - this.baseY) * 0.3;
                    
                    point.y = this.baseY + wave1 + wave2 + wave3 + mouseInfluence;
                }
            }
            
            draw() {
                const hue = (120 + this.hueOffset + colorShift + Math.sin(time) * 20) % 360;
                
                // 绘制多层渐变产生发光效果
                for (let layer = 0; layer < 3; layer++) {
                    ctx.beginPath();
                    ctx.moveTo(0, height);
                    
                    for (let i = 0; i < this.points.length; i++) {
                        const point = this.points[i];
                        const layerOffset = (2 - layer) * 20;
                        
                        if (i === 0) {
                            ctx.lineTo(point.x, point.y + layerOffset);
                        } else {
                            const prev = this.points[i - 1];
                            const cx = (prev.x + point.x) / 2;
                            const cy = (prev.y + point.y) / 2 + layerOffset;
                            ctx.quadraticCurveTo(prev.x, prev.y + layerOffset, cx, cy);
                        }
                    }
                    
                    ctx.lineTo(width, height);
                    ctx.closePath();
                    
                    const alpha = 0.1 + layer * 0.1;
                    ctx.fillStyle = `hsla(${hue}, 80%, ${50 + layer * 10}%, ${alpha})`;
                    ctx.fill();
                }
                
                // 核心亮线
                ctx.beginPath();
                for (let i = 0; i < this.points.length; i++) {
                    const point = this.points[i];
                    if (i === 0) {
                        ctx.moveTo(point.x, point.y);
                    } else {
                        const prev = this.points[i - 1];
                        const cx = (prev.x + point.x) / 2;
                        const cy = (prev.y + point.y) / 2;
                        ctx.quadraticCurveTo(prev.x, prev.y, cx, cy);
                    }
                }
                ctx.strokeStyle = `hsla(${hue}, 100%, 80%, 0.6)`;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }
        
        function initStars() {
            stars = [];
            for (let i = 0; i < 200; i++) {
                stars.push(new Star());
            }
        }
        
        function initAuroras() {
            auroras = [];
            for (let i = 0; i < 4; i++) {
                auroras.push(new Aurora(i, 4));
            }
        }
        
        function drawMountains() {
            // 远山轮廓
            ctx.beginPath();
            ctx.moveTo(0, height);
            
            for (let x = 0; x <= width; x += 50) {
                const mountainHeight = 100 + Math.sin(x * 0.01) * 50 + Math.sin(x * 0.003) * 80;
                ctx.lineTo(x, height - mountainHeight);
            }
            
            ctx.lineTo(width, height);
            ctx.closePath();
            
            const gradient = ctx.createLinearGradient(0, height - 200, 0, height);
            gradient.addColorStop(0, 'rgba(10, 15, 30, 0.8)');
            gradient.addColorStop(1, 'rgba(5, 10, 20, 1)');
            ctx.fillStyle = gradient;
            ctx.fill();
        }
        
        function animate() {
            time += 0.01;
            
            // 夜空渐变
            const skyGradient = ctx.createLinearGradient(0, 0, 0, height);
            skyGradient.addColorStop(0, '#020510');
            skyGradient.addColorStop(0.4, '#0a1020');
            skyGradient.addColorStop(0.7, '#1a1a3a');
            skyGradient.addColorStop(1, '#2a2a4a');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, width, height);
            
            // 星星
            stars.forEach(star => {
                star.update();
                star.draw();
            });
            
            // 极光
            auroras.forEach(aurora => {
                aurora.update();
                aurora.draw();
            });
            
            // 山脉
            drawMountains();
            
            requestAnimationFrame(animate);
        }
        
        window.addEventListener('resize', resize);
        
        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });
        
        window.addEventListener('click', () => {
            colorShift += 60;
        });
        
        window.addEventListener('touchmove', (e) => {
            mouseX = e.touches[0].clientX;
            mouseY = e.touches[0].clientY;
        });
        
        window.addEventListener('touchstart', () => {
            colorShift += 60;
        });
        
        resize();
        initAuroras();
        animate();
    </script>
</body>
</html>
