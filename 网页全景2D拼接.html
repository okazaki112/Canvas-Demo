<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网页全景2D拼接</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            background: #0a0a0a;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        canvas { display: block; cursor: grab; }
        canvas:active { cursor: grabbing; }
        .controls {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10;
            display: flex;
            gap: 10px;
        }
        .controls input[type="file"] { display: none; }
        .controls label, .controls button {
            padding: 10px 20px;
            border: 2px solid #333;
            background: rgba(0,0,0,0.8);
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .controls label:hover, .controls button:hover { border-color: #00d4ff; }
        .info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="controls">
        <label for="imageInput">上传全景图</label>
        <input type="file" id="imageInput" accept="image/*">
        <button onclick="resetView()">重置视角</button>
    </div>
    <div class="info">拖拽查看全景，滚轮缩放</div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const imageInput = document.getElementById('imageInput');
        
        let width, height;
        let panoramaImage = null;
        let viewX = 0;
        let viewY = 0;
        let zoom = 1;
        let isDragging = false;
        let lastX = 0;
        let lastY = 0;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            if (!panoramaImage) {
                drawDefaultPanorama();
            }
        }
        
        function drawDefaultPanorama() {
            const patternCanvas = document.createElement('canvas');
            patternCanvas.width = 2000;
            patternCanvas.height = 1000;
            const pctx = patternCanvas.getContext('2d');
            
            const gradient = pctx.createLinearGradient(0, 0, 2000, 0);
            for (let i = 0; i <= 10; i++) {
                gradient.addColorStop(i / 10, `hsl(${i * 36}, 70%, 50%)`);
            }
            pctx.fillStyle = gradient;
            pctx.fillRect(0, 0, 2000, 1000);
            
            for (let i = 0; i < 50; i++) {
                pctx.beginPath();
                pctx.arc(
                    Math.random() * 2000,
                    Math.random() * 1000,
                    Math.random() * 50 + 10,
                    0, Math.PI * 2
                );
                pctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.3})`;
                pctx.fill();
            }
            
            pctx.fillStyle = '#fff';
            pctx.font = 'bold 40px Microsoft YaHei';
            pctx.textAlign = 'center';
            pctx.fillText('全景视图演示', 1000, 500);
            
            panoramaImage = patternCanvas;
            viewX = 0;
            viewY = 0;
            zoom = 1;
        }
        
        function loadImage(file) {
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    const aspectRatio = img.width / img.height;
                    const targetHeight = 1000;
                    const targetWidth = targetHeight * aspectRatio;
                    
                    const canvas2 = document.createElement('canvas');
                    canvas2.width = targetWidth;
                    canvas2.height = targetHeight;
                    canvas2.getContext('2d').drawImage(img, 0, 0, targetWidth, targetHeight);
                    
                    panoramaImage = canvas2;
                    viewX = 0;
                    viewY = 0;
                    zoom = 1;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
        
        function draw() {
            if (!panoramaImage) return;
            
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, width, height);
            
            const scaledWidth = panoramaImage.width * zoom;
            const scaledHeight = panoramaImage.height * zoom;
            
            let drawX = -viewX;
            let drawY = -viewY;
            
            if (scaledWidth > width) {
                drawX = ((drawX % scaledWidth) + scaledWidth) % scaledWidth;
                if (drawX > 0) drawX -= scaledWidth;
            } else {
                drawX = (width - scaledWidth) / 2;
            }
            
            if (scaledHeight > height) {
                drawY = Math.max(0, Math.min(drawY, scaledHeight - height));
            } else {
                drawY = (height - scaledHeight) / 2;
            }
            
            for (let x = drawX; x < width; x += scaledWidth) {
                ctx.drawImage(panoramaImage, x, drawY, scaledWidth, scaledHeight);
            }
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.fillRect(0, 0, width, 2);
            ctx.fillRect(0, height - 2, width, 2);
        }
        
        function animate() {
            draw();
            requestAnimationFrame(animate);
        }
        
        canvas.addEventListener('mousedown', e => {
            isDragging = true;
            lastX = e.clientX;
            lastY = e.clientY;
        });
        
        canvas.addEventListener('mousemove', e => {
            if (!isDragging) return;
            const dx = e.clientX - lastX;
            const dy = e.clientY - lastY;
            viewX -= dx;
            viewY -= dy;
            lastX = e.clientX;
            lastY = e.clientY;
        });
        
        canvas.addEventListener('mouseup', () => isDragging = false);
        canvas.addEventListener('mouseleave', () => isDragging = false);
        
        canvas.addEventListener('wheel', e => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            zoom *= delta;
            zoom = Math.max(0.5, Math.min(3, zoom));
        });
        
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            isDragging = true;
            lastX = e.touches[0].clientX;
            lastY = e.touches[0].clientY;
        });
        
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            if (!isDragging) return;
            const dx = e.touches[0].clientX - lastX;
            const dy = e.touches[0].clientY - lastY;
            viewX -= dx;
            viewY -= dy;
            lastX = e.touches[0].clientX;
            lastY = e.touches[0].clientY;
        });
        
        canvas.addEventListener('touchend', () => isDragging = false);
        
        imageInput.addEventListener('change', e => {
            const file = e.target.files[0];
            if (file) loadImage(file);
        });
        
        function resetView() {
            viewX = 0;
            viewY = 0;
            zoom = 1;
        }
        
        window.addEventListener('resize', resize);
        resize();
        animate();
    </script>
</body>
</html>
