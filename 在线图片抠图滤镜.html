<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线图片抠图滤镜</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            background: #0a0a0a;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        canvas { display: block; }
        .controls {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            max-width: 80%;
        }
        .controls input[type="file"] { display: none; }
        .controls label, .controls button {
            padding: 8px 16px;
            border: 1px solid #333;
            background: rgba(0,0,0,0.8);
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .controls label:hover, .controls button:hover { border-color: #00d4ff; }
        .info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="controls">
        <label for="imageInput">上传图片</label>
        <input type="file" id="imageInput" accept="image/*">
        <button onclick="applyFilter('oil')">油画</button>
        <button onclick="applyFilter('sketch')">素描</button>
        <button onclick="applyFilter('blur')">模糊</button>
        <button onclick="applyFilter('sharpen')">锐化</button>
        <button onclick="applyFilter('sepia')">复古</button>
        <button onclick="applyFilter('invert')">反色</button>
        <button onclick="resetImage()">重置</button>
        <button onclick="saveImage()">保存</button>
    </div>
    <div class="info">上传图片后应用滤镜实时预览</div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const imageInput = document.getElementById('imageInput');
        
        let width, height;
        let originalImage = null;
        let currentImage = null;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            if (currentImage) {
                drawImage(currentImage);
            } else {
                drawPlaceholder();
            }
        }
        
        function drawPlaceholder() {
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, width, height);
            
            ctx.fillStyle = '#333';
            ctx.font = '24px Microsoft YaHei';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('请上传图片', width / 2, height / 2);
        }
        
        function loadImage(file) {
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    const scale = Math.min(width / img.width, height / img.height, 1);
                    const w = img.width * scale;
                    const h = img.height * scale;
                    
                    const canvas2 = document.createElement('canvas');
                    canvas2.width = w;
                    canvas2.height = h;
                    canvas2.getContext('2d').drawImage(img, 0, 0, w, h);
                    
                    originalImage = canvas2;
                    currentImage = canvas2;
                    drawImage(currentImage);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
        
        function drawImage(img) {
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, width, height);
            
            const x = (width - img.width) / 2;
            const y = (height - img.height) / 2;
            ctx.drawImage(img, x, y);
        }
        
        function applyFilter(type) {
            if (!originalImage) return;
            
            const canvas2 = document.createElement('canvas');
            canvas2.width = originalImage.width;
            canvas2.height = originalImage.height;
            const ctx2 = canvas2.getContext('2d');
            ctx2.drawImage(originalImage, 0, 0);
            
            const imageData = ctx2.getImageData(0, 0, canvas2.width, canvas2.height);
            const data = imageData.data;
            
            switch(type) {
                case 'oil':
                    applyOilPaint(data, canvas2.width, canvas2.height);
                    break;
                case 'sketch':
                    applySketch(data, canvas2.width, canvas2.height);
                    break;
                case 'blur':
                    applyBlur(data, canvas2.width, canvas2.height);
                    break;
                case 'sharpen':
                    applySharpen(data, canvas2.width, canvas2.height);
                    break;
                case 'sepia':
                    applySepia(data);
                    break;
                case 'invert':
                    applyInvert(data);
                    break;
            }
            
            ctx2.putImageData(imageData, 0, 0);
            currentImage = canvas2;
            drawImage(currentImage);
        }
        
        function applyOilPaint(data, width, height) {
            const radius = 4;
            const copy = new Uint8ClampedArray(data);
            
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const intensityCount = {};
                    const rgb = {};
                    
                    for (let dy = -radius; dy <= radius; dy++) {
                        for (let dx = -radius; dx <= radius; dx++) {
                            const nx = Math.min(width - 1, Math.max(0, x + dx));
                            const ny = Math.min(height - 1, Math.max(0, y + dy));
                            const idx = (ny * width + nx) * 4;
                            
                            const intensity = Math.round((copy[idx] + copy[idx + 1] + copy[idx + 2]) / 3 / 25) * 25;
                            
                            if (!intensityCount[intensity]) {
                                intensityCount[intensity] = 0;
                                rgb[intensity] = [0, 0, 0];
                            }
                            intensityCount[intensity]++;
                            rgb[intensity][0] += copy[idx];
                            rgb[intensity][1] += copy[idx + 1];
                            rgb[intensity][2] += copy[idx + 2];
                        }
                    }
                    
                    let maxCount = 0;
                    let maxIntensity = 0;
                    for (let i in intensityCount) {
                        if (intensityCount[i] > maxCount) {
                            maxCount = intensityCount[i];
                            maxIntensity = i;
                        }
                    }
                    
                    const idx = (y * width + x) * 4;
                    data[idx] = rgb[maxIntensity][0] / maxCount;
                    data[idx + 1] = rgb[maxIntensity][1] / maxCount;
                    data[idx + 2] = rgb[maxIntensity][2] / maxCount;
                }
            }
        }
        
        function applySketch(data, width, height) {
            const gray = new Uint8ClampedArray(width * height);
            
            for (let i = 0; i < data.length; i += 4) {
                gray[i / 4] = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
            }
            
            for (let y = 1; y < height - 1; y++) {
                for (let x = 1; x < width - 1; x++) {
                    const idx = y * width + x;
                    const gx = -gray[idx - width - 1] + gray[idx - width + 1]
                             - 2 * gray[idx - 1] + 2 * gray[idx + 1]
                             - gray[idx + width - 1] + gray[idx + width + 1];
                    const gy = -gray[idx - width - 1] - 2 * gray[idx - width] - gray[idx - width + 1]
                             + gray[idx + width - 1] + 2 * gray[idx + width] + gray[idx + width + 1];
                    
                    const edge = Math.min(255, Math.sqrt(gx * gx + gy * gy));
                    const val = 255 - edge;
                    
                    const dataIdx = idx * 4;
                    data[dataIdx] = val;
                    data[dataIdx + 1] = val;
                    data[dataIdx + 2] = val;
                }
            }
        }
        
        function applyBlur(data, width, height) {
            const copy = new Uint8ClampedArray(data);
            const kernel = [1, 2, 1, 2, 4, 2, 1, 2, 1];
            const kernelSum = 16;
            
            for (let y = 1; y < height - 1; y++) {
                for (let x = 1; x < width - 1; x++) {
                    let r = 0, g = 0, b = 0;
                    
                    for (let ky = -1; ky <= 1; ky++) {
                        for (let kx = -1; kx <= 1; kx++) {
                            const idx = ((y + ky) * width + (x + kx)) * 4;
                            const kidx = (ky + 1) * 3 + (kx + 1);
                            r += copy[idx] * kernel[kidx];
                            g += copy[idx + 1] * kernel[kidx];
                            b += copy[idx + 2] * kernel[kidx];
                        }
                    }
                    
                    const idx = (y * width + x) * 4;
                    data[idx] = r / kernelSum;
                    data[idx + 1] = g / kernelSum;
                    data[idx + 2] = b / kernelSum;
                }
            }
        }
        
        function applySharpen(data, width, height) {
            const copy = new Uint8ClampedArray(data);
            const kernel = [0, -1, 0, -1, 5, -1, 0, -1, 0];
            
            for (let y = 1; y < height - 1; y++) {
                for (let x = 1; x < width - 1; x++) {
                    let r = 0, g = 0, b = 0;
                    
                    for (let ky = -1; ky <= 1; ky++) {
                        for (let kx = -1; kx <= 1; kx++) {
                            const idx = ((y + ky) * width + (x + kx)) * 4;
                            const kidx = (ky + 1) * 3 + (kx + 1);
                            r += copy[idx] * kernel[kidx];
                            g += copy[idx + 1] * kernel[kidx];
                            b += copy[idx + 2] * kernel[kidx];
                        }
                    }
                    
                    const idx = (y * width + x) * 4;
                    data[idx] = Math.min(255, Math.max(0, r));
                    data[idx + 1] = Math.min(255, Math.max(0, g));
                    data[idx + 2] = Math.min(255, Math.max(0, b));
                }
            }
        }
        
        function applySepia(data) {
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                
                data[i] = Math.min(255, r * 0.393 + g * 0.769 + b * 0.189);
                data[i + 1] = Math.min(255, r * 0.349 + g * 0.686 + b * 0.168);
                data[i + 2] = Math.min(255, r * 0.272 + g * 0.534 + b * 0.131);
            }
        }
        
        function applyInvert(data) {
            for (let i = 0; i < data.length; i += 4) {
                data[i] = 255 - data[i];
                data[i + 1] = 255 - data[i + 1];
                data[i + 2] = 255 - data[i + 2];
            }
        }
        
        function resetImage() {
            if (originalImage) {
                currentImage = originalImage;
                drawImage(currentImage);
            }
        }
        
        function saveImage() {
            if (currentImage) {
                const link = document.createElement('a');
                link.download = 'filtered-image.png';
                link.href = currentImage.toDataURL();
                link.click();
            }
        }
        
        imageInput.addEventListener('change', e => {
            const file = e.target.files[0];
            if (file) loadImage(file);
        });
        
        window.addEventListener('resize', resize);
        resize();
    </script>
</body>
</html>
