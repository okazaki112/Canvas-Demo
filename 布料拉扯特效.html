<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>布料拉扯特效</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            background: #1a1a2e;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        canvas { display: block; }
        .info {
            position: fixed;
            top: 20px;
            left: 20px;
            color: rgba(255,255,255,0.7);
            font-size: 14px;
            pointer-events: none;
            z-index: 10;
        }
        .info h1 { font-size: 18px; margin-bottom: 8px; color: #fff; }
    </style>
</head>
<body>
    <div class="info">
        <h1>布料拉扯特效</h1>
        <p>鼠标拖拽拉伸布料，松手回弹</p>
    </div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let points = [];
        let sticks = [];
        let mouse = { x: 0, y: 0, down: false, dragPoint: null };
        
        const COLS = 25;
        const ROWS = 18;
        const SPACING = 25;
        const GRAVITY = 0.3;
        const FRICTION = 0.98;
        const ITERATIONS = 5;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initCloth();
        }
        
        class Point {
            constructor(x, y, pinned = false) {
                this.x = x;
                this.y = y;
                this.oldX = x;
                this.oldY = y;
                this.pinned = pinned;
            }
            
            update() {
                if (this.pinned) return;
                
                const vx = (this.x - this.oldX) * FRICTION;
                const vy = (this.y - this.oldY) * FRICTION;
                
                this.oldX = this.x;
                this.oldY = this.y;
                
                this.x += vx;
                this.y += vy;
                this.y += GRAVITY;
                
                if (this.x < 0) { this.x = 0; this.oldX = this.x + vx * 0.5; }
                if (this.x > width) { this.x = width; this.oldX = this.x + vx * 0.5; }
                if (this.y < 0) { this.y = 0; this.oldY = this.y + vy * 0.5; }
                if (this.y > height) { this.y = height; this.oldY = this.y + vy * 0.5; }
            }
        }
        
        class Stick {
            constructor(p1, p2) {
                this.p1 = p1;
                this.p2 = p2;
                this.length = Math.sqrt((p1.x - p2.x) ** 2 + (p1.y - p2.y) ** 2);
            }
            
            update() {
                const dx = this.p2.x - this.p1.x;
                const dy = this.p2.y - this.p1.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist === 0) return;
                
                const diff = this.length - dist;
                const percent = diff / dist / 2;
                const offsetX = dx * percent;
                const offsetY = dy * percent;
                
                if (!this.p1.pinned) {
                    this.p1.x -= offsetX;
                    this.p1.y -= offsetY;
                }
                if (!this.p2.pinned) {
                    this.p2.x += offsetX;
                    this.p2.y += offsetY;
                }
            }
        }
        
        function initCloth() {
            points = [];
            sticks = [];
            
            const startX = (width - COLS * SPACING) / 2;
            const startY = 50;
            
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    const pinned = y === 0 && x % 4 === 0;
                    points.push(new Point(
                        startX + x * SPACING,
                        startY + y * SPACING,
                        pinned
                    ));
                }
            }
            
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    const i = y * COLS + x;
                    if (x < COLS - 1) {
                        sticks.push(new Stick(points[i], points[i + 1]));
                    }
                    if (y < ROWS - 1) {
                        sticks.push(new Stick(points[i], points[i + COLS]));
                    }
                }
            }
        }
        
        function animate() {
            ctx.fillStyle = 'rgba(26, 26, 46, 0.3)';
            ctx.fillRect(0, 0, width, height);
            
            for (let p of points) {
                p.update();
            }
            
            for (let i = 0; i < ITERATIONS; i++) {
                for (let s of sticks) {
                    s.update();
                }
            }
            
            if (mouse.down && mouse.dragPoint) {
                mouse.dragPoint.x = mouse.x;
                mouse.dragPoint.y = mouse.y;
                mouse.dragPoint.oldX = mouse.x;
                mouse.dragPoint.oldY = mouse.y;
            }
            
            ctx.strokeStyle = 'rgba(100, 200, 255, 0.6)';
            ctx.lineWidth = 1;
            
            for (let s of sticks) {
                ctx.beginPath();
                ctx.moveTo(s.p1.x, s.p1.y);
                ctx.lineTo(s.p2.x, s.p2.y);
                ctx.stroke();
            }
            
            for (let p of points) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.pinned ? 3 : 1.5, 0, Math.PI * 2);
                ctx.fillStyle = p.pinned ? 'rgba(255, 100, 100, 0.8)' : 'rgba(100, 200, 255, 0.5)';
                ctx.fill();
            }
            
            requestAnimationFrame(animate);
        }
        
        function getClosestPoint(x, y) {
            let closest = null;
            let minDist = Infinity;
            
            for (let p of points) {
                const dist = Math.sqrt((p.x - x) ** 2 + (p.y - y) ** 2);
                if (dist < minDist && dist < 30) {
                    minDist = dist;
                    closest = p;
                }
            }
            
            return closest;
        }
        
        canvas.addEventListener('mousedown', e => {
            mouse.down = true;
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            mouse.dragPoint = getClosestPoint(e.clientX, e.clientY);
        });
        
        canvas.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        
        canvas.addEventListener('mouseup', () => {
            mouse.down = false;
            mouse.dragPoint = null;
        });
        
        canvas.addEventListener('mouseleave', () => {
            mouse.down = false;
            mouse.dragPoint = null;
        });
        
        window.addEventListener('resize', resize);
        resize();
        animate();
    </script>
</body>
</html>
