<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas 演示合集</title>
    <style>
        :root {
            /* 主色调 - 深空科技风 (禁用紫色/靛蓝) */
            --primary-500: #0ea5e9;
            --primary-600: #0284c7;
            --primary-700: #0369a1;
            --accent-cyan: #06b6d4;
            --accent-green: #22c55e;
            --accent-orange: #f97316;
            --accent-amber: #f59e0b;
            --accent-rose: #f43f5e;
            
            /* 背景色 - 多层次深色 */
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a25;
            --bg-card: rgba(255, 255, 255, 0.02);
            --bg-card-hover: rgba(255, 255, 255, 0.05);
            --bg-elevated: rgba(255, 255, 255, 0.08);
            
            /* 文字色 */
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --text-tertiary: #71717a;
            --text-muted: #52525b;
            
            /* 边框 */
            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(14, 165, 233, 0.3);
            --border-active: rgba(6, 182, 212, 0.5);
            
            /* 渐变 - 禁用蓝紫渐变 */
            --gradient-hero: linear-gradient(180deg, #0a0a0f 0%, #12121a 50%, #0a0a0f 100%);
            --gradient-accent: linear-gradient(135deg, #06b6d4 0%, #0ea5e9 50%, #22c55e 100%);
            --gradient-card: linear-gradient(145deg, rgba(6, 182, 212, 0.08) 0%, rgba(34, 197, 94, 0.04) 100%);
            --gradient-glow: radial-gradient(ellipse at center, rgba(6, 182, 212, 0.15) 0%, transparent 70%);
            
            /* 阴影 */
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 30px rgba(6, 182, 212, 0.2);
            --shadow-glow-green: 0 0 30px rgba(34, 197, 94, 0.15);
            
            /* 间距 */
            --space-xs: 0.25rem;
            --space-sm: 0.5rem;
            --space-md: 1rem;
            --space-lg: 1.5rem;
            --space-xl: 2rem;
            --space-2xl: 3rem;
            --space-3xl: 4rem;
            
            /* 圆角 */
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-xl: 20px;
            --radius-full: 9999px;
            
            /* 动画 */
            --transition-fast: 150ms ease;
            --transition-base: 250ms ease;
            --transition-slow: 350ms ease;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }
        
        /* 背景装饰 */
        .bg-decoration {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }
        
        .bg-gradient {
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--gradient-hero);
        }
        
        .bg-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.3;
            animation: float 25s ease-in-out infinite;
        }
        
        .bg-glow-1 {
            width: 500px;
            height: 500px;
            background: var(--accent-cyan);
            top: -150px;
            right: -100px;
            animation-delay: 0s;
        }
        
        .bg-glow-2 {
            width: 400px;
            height: 400px;
            background: var(--accent-green);
            bottom: 10%;
            left: -150px;
            animation-delay: -8s;
        }
        
        .bg-glow-3 {
            width: 300px;
            height: 300px;
            background: var(--accent-orange);
            top: 40%;
            right: 15%;
            animation-delay: -16s;
        }
        
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(20px, -30px) scale(1.05); }
            50% { transform: translate(-10px, 20px) scale(0.95); }
            75% { transform: translate(30px, 10px) scale(1.02); }
        }
        
        /* 网格背景 */
        .bg-grid {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
        }
        
        /* 粒子效果 */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
        }
        
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--accent-cyan);
            border-radius: 50%;
            opacity: 0.5;
            animation: particle-float 20s infinite linear;
        }
        
        @keyframes particle-float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }
        
        /* 主容器 */
        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: var(--space-xl);
        }
        
        /* 头部 */
        .header {
            text-align: center;
            padding: var(--space-3xl) 0 var(--space-2xl);
            margin-bottom: var(--space-2xl);
        }
        
        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: var(--space-sm);
            padding: var(--space-sm) var(--space-lg);
            background: rgba(6, 182, 212, 0.1);
            border: 1px solid rgba(6, 182, 212, 0.2);
            border-radius: var(--radius-full);
            font-size: 0.875rem;
            color: var(--accent-cyan);
            margin-bottom: var(--space-xl);
            backdrop-filter: blur(10px);
            transition: all var(--transition-base);
        }
        
        .header-badge:hover {
            background: rgba(6, 182, 212, 0.15);
            border-color: rgba(6, 182, 212, 0.3);
            transform: translateY(-2px);
        }
        
        .header-badge svg {
            width: 18px;
            height: 18px;
        }
        
        .header h1 {
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: var(--space-lg);
            background: var(--gradient-accent);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
        }
        
        .header p {
            color: var(--text-secondary);
            font-size: 1.125rem;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.7;
        }
        
        /* 统计 */
        .stats {
            display: flex;
            justify-content: center;
            gap: var(--space-xl);
            margin-bottom: var(--space-3xl);
            flex-wrap: wrap;
        }
        
        .stat-item {
            text-align: center;
            padding: var(--space-lg) var(--space-2xl);
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-xl);
            backdrop-filter: blur(10px);
            transition: all var(--transition-base);
            min-width: 140px;
        }
        
        .stat-item:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-hover);
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg), var(--shadow-glow);
        }
        
        .stat-number {
            font-size: 2.75rem;
            font-weight: 800;
            background: var(--gradient-accent);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: var(--space-xs);
        }
        
        .stat-label {
            color: var(--text-tertiary);
            font-size: 0.875rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        /* 搜索 */
        .search-wrapper {
            max-width: 480px;
            margin: 0 auto var(--space-2xl);
            position: relative;
        }
        
        .search-box {
            width: 100%;
            padding: var(--space-md) var(--space-md) var(--space-md) 3rem;
            font-size: 1rem;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-full);
            background: var(--bg-card);
            color: var(--text-primary);
            outline: none;
            transition: all var(--transition-base);
        }
        
        .search-box:focus {
            border-color: var(--primary-500);
            background: var(--bg-card-hover);
            box-shadow: var(--shadow-glow);
        }
        
        .search-box::placeholder {
            color: var(--text-tertiary);
        }
        
        .search-icon {
            position: absolute;
            left: var(--space-lg);
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            color: var(--text-tertiary);
            pointer-events: none;
            transition: color var(--transition-fast);
        }
        
        .search-box:focus + .search-icon {
            color: var(--accent-cyan);
        }
        
        /* 分类 */
        .categories {
            display: flex;
            justify-content: center;
            gap: var(--space-sm);
            margin-bottom: var(--space-2xl);
            flex-wrap: wrap;
            padding: 0 var(--space-md);
        }
        
        .category-btn {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            padding: var(--space-sm) var(--space-lg);
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-full);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition-base);
            font-size: 0.875rem;
            font-weight: 500;
        }
        
        .category-btn svg {
            width: 16px;
            height: 16px;
            transition: transform var(--transition-fast);
        }
        
        .category-btn:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-hover);
            color: var(--text-primary);
            transform: translateY(-2px);
        }
        
        .category-btn:hover svg {
            transform: scale(1.1);
        }
        
        .category-btn.active {
            background: rgba(6, 182, 212, 0.15);
            border-color: var(--accent-cyan);
            color: var(--text-primary);
            box-shadow: var(--shadow-glow);
        }
        
        /* 网格 */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: var(--space-xl);
        }
        
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-xl);
            overflow: hidden;
            transition: all var(--transition-slow);
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--gradient-accent);
            opacity: 0;
            transition: opacity var(--transition-base);
        }
        
        .card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--gradient-glow);
            opacity: 0;
            transition: opacity var(--transition-base);
            pointer-events: none;
        }
        
        .card:hover {
            transform: translateY(-8px);
            background: var(--bg-card-hover);
            border-color: var(--border-hover);
            box-shadow: var(--shadow-lg), var(--shadow-glow);
        }
        
        .card:hover::before {
            opacity: 1;
        }
        
        .card:hover::after {
            opacity: 0.5;
        }
        
        .card-preview {
            height: 160px;
            background: var(--gradient-card);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        .card-preview::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, transparent 30%, rgba(255, 255, 255, 0.02) 50%, transparent 70%);
            animation: shimmer 5s infinite;
        }
        
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        .card-icon {
            width: 56px;
            height: 56px;
            color: var(--accent-cyan);
            z-index: 1;
            transition: all var(--transition-base);
            filter: drop-shadow(0 0 10px rgba(6, 182, 212, 0.3));
        }
        
        .card:hover .card-icon {
            color: var(--accent-green);
            transform: scale(1.15) rotate(5deg);
            filter: drop-shadow(0 0 20px rgba(34, 197, 94, 0.4));
        }
        
        .card-content {
            padding: var(--space-lg);
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .card-title {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: var(--space-sm);
            color: var(--text-primary);
            transition: color var(--transition-fast);
        }
        
        .card:hover .card-title {
            color: var(--accent-cyan);
        }
        
        .card-desc {
            font-size: 0.875rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: var(--space-md);
            flex: 1;
        }
        
        .card-tags {
            display: flex;
            gap: var(--space-sm);
            flex-wrap: wrap;
        }
        
        .tag {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(6, 182, 212, 0.08);
            border: 1px solid rgba(6, 182, 212, 0.15);
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            color: var(--accent-cyan);
            font-weight: 500;
            transition: all var(--transition-fast);
        }
        
        .tag:hover {
            background: rgba(6, 182, 212, 0.12);
            border-color: rgba(6, 182, 212, 0.25);
        }
        
        .tag svg {
            width: 12px;
            height: 12px;
        }
        
        /* 页脚 */
        .footer {
            text-align: center;
            padding: var(--space-3xl) var(--space-md) var(--space-2xl);
            color: var(--text-tertiary);
            font-size: 0.875rem;
        }
        
        .footer p {
            margin-bottom: var(--space-sm);
        }
        
        .footer a {
            color: var(--accent-cyan);
            text-decoration: none;
            transition: color var(--transition-fast);
        }
        
        .footer a:hover {
            color: var(--accent-green);
        }
        
        .hidden {
            display: none !important;
        }
        
        /* 响应式 */
        @media (max-width: 768px) {
            .container {
                padding: var(--space-lg);
            }
            
            .header {
                padding: var(--space-2xl) 0 var(--space-xl);
            }
            
            .stats {
                gap: var(--space-md);
            }
            
            .stat-item {
                padding: var(--space-md) var(--space-lg);
                flex: 1;
                min-width: 100px;
            }
            
            .stat-number {
                font-size: 2rem;
            }
            
            .grid {
                grid-template-columns: 1fr;
                gap: var(--space-lg);
            }
            
            .categories {
                gap: var(--space-xs);
            }
            
            .category-btn {
                padding: 8px 14px;
                font-size: 0.8125rem;
            }
            
            .bg-glow {
                filter: blur(60px);
            }
            
            .bg-glow-1 { width: 300px; height: 300px; }
            .bg-glow-2 { width: 250px; height: 250px; }
            .bg-glow-3 { width: 200px; height: 200px; }
        }
        
        /* 滚动条 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--border-subtle);
            border-radius: var(--radius-full);
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--border-hover);
        }
        
        /* 加载动画 */
        .fade-in {
            animation: fadeIn 0.6s ease-out forwards;
            opacity: 0;
        }
        
        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }
        
        .card:nth-child(1) { animation-delay: 0.05s; }
        .card:nth-child(2) { animation-delay: 0.1s; }
        .card:nth-child(3) { animation-delay: 0.15s; }
        .card:nth-child(4) { animation-delay: 0.2s; }
        .card:nth-child(5) { animation-delay: 0.25s; }
        .card:nth-child(6) { animation-delay: 0.3s; }
        .card:nth-child(7) { animation-delay: 0.35s; }
        .card:nth-child(8) { animation-delay: 0.4s; }
    </style>
</head>
<body>
    <!-- 背景装饰 -->
    <div class="bg-decoration">
        <div class="bg-gradient"></div>
        <div class="bg-glow bg-glow-1"></div>
        <div class="bg-glow bg-glow-2"></div>
        <div class="bg-glow bg-glow-3"></div>
        <div class="bg-grid"></div>
        <div class="particles" id="particles"></div>
    </div>
    
    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <div class="header-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                    <polyline points="2 17 12 22 22 17"></polyline>
                    <polyline points="2 12 12 17 22 12"></polyline>
                </svg>
                <span>37个交互演示</span>
            </div>
            <h1>Canvas 演示合集</h1>
            <p>精心制作的 HTML5 Canvas 交互演示，涵盖物理模拟、视觉效果、自然现象、数据可视化等多个领域</p>
        </header>
        
        <!-- 统计 -->
        <div class="stats">
            <div class="stat-item">
                <div class="stat-number">37</div>
                <div class="stat-label">演示项目</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">7</div>
                <div class="stat-label">分类</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">100%</div>
                <div class="stat-label">纯Canvas</div>
            </div>
        </div>
        
        <!-- 搜索 -->
        <div class="search-wrapper">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.35-4.35"></path>
            </svg>
            <input type="text" class="search-box" id="searchInput" placeholder="搜索演示项目..." onkeyup="filterCards()">
        </div>
        
        <!-- 分类 -->
        <div class="categories">
            <button class="category-btn active" onclick="filterCategory('all')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
                全部
            </button>
            <button class="category-btn" onclick="filterCategory('physics')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path>
                    <path d="M2 12h20"></path>
                </svg>
                物理模拟
            </button>
            <button class="category-btn" onclick="filterCategory('visual')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
                视觉效果
            </button>
            <button class="category-btn" onclick="filterCategory('nature')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
                </svg>
                自然/生物
            </button>
            <button class="category-btn" onclick="filterCategory('interactive')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
                交互体验
            </button>
            <button class="category-btn" onclick="filterCategory('game')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="6" width="20" height="12" rx="2"></rect>
                    <path d="M6 12h4"></path>
                    <path d="M8 10v4"></path>
                    <circle cx="16" cy="12" r="1.5"></circle>
                    <circle cx="19" cy="10" r="0.5"></circle>
                </svg>

            </button>

        function createCard(demo, index) {
            const iconSvg = icons[demo.icon] || icons.circle;
            return `
                <div class="card fade-in" data-category="${demo.category}" data-name="${demo.name}" onclick="openDemo('${demo.file}')" style="animation-delay: ${index * 0.03}s">
                    <div class="card-preview">
                        ${iconSvg}
                    </div>
                    <div class="card-content">
                        <div class="card-title">${demo.name}</div>
                        <div class="card-desc">${demo.desc}</div>
                        <div class="card-tags">
                            <span class="tag">
                                ${icons[demo.category]}
                                ${categoryNames[demo.category]}
                            </span>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCards() {
            const grid = document.getElementById('cardGrid');
            grid.innerHTML = demos.map((demo, index) => createCard(demo, index)).join('');
        }

        function openDemo(file) {
            // 对中文文件名进行 URL 编码
            const encodedFile = encodeURIComponent(file);
            window.open(encodedFile, '_blank');
        }

        function filterCategory(category) {
            // 更新按钮状态
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.closest('.category-btn').classList.add('active');
            
            // 过滤卡片
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                if (category === 'all' || card.dataset.category === category) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
        }

        function filterCards() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.card');
            
            cards.forEach(card => {
                const name = card.dataset.name.toLowerCase();
                const desc = card.querySelector('.card-desc').textContent.toLowerCase();
                
                if (name.includes(searchTerm) || desc.includes(searchTerm)) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
        }

        // 创建背景粒子
        function createParticles() {
            const container = document.getElementById('particles');
            const particleCount = 25;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (15 + Math.random() * 20) + 's';
                particle.style.animationDelay = Math.random() * 20 + 's';
                container.appendChild(particle);
            }
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            renderCards();
            createParticles();
        });
