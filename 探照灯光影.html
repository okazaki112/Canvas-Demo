<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>探照灯光影</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            background: #000;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        canvas { display: block; }
        .content {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 1;
        }
        .content h1 {
            font-size: 80px;
            color: #fff;
            text-shadow: 0 0 30px rgba(255,255,255,0.5);
            margin-bottom: 20px;
        }
        .content p {
            font-size: 24px;
            color: rgba(255,255,255,0.8);
        }
    </style>
</head>
<body>
    <div class="content">
        <h1>探照灯效果</h1>
        <p>移动鼠标，光束照亮黑暗</p>
    </div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let mouse = { x: 0, y: 0 };
        let lightRadius = 150;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            // 初始化鼠标位置到屏幕中心
            if (mouse.x === 0 && mouse.y === 0) {
                mouse.x = width / 2;
                mouse.y = height / 2;
            }
        }
        
        function drawSpotlight() {
            ctx.clearRect(0, 0, width, height);
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.95)';
            ctx.fillRect(0, 0, width, height);
            
            ctx.globalCompositeOperation = 'destination-out';
            
            const gradient = ctx.createRadialGradient(
                mouse.x, mouse.y, 0,
                mouse.x, mouse.y, lightRadius
            );
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.7, 'rgba(255, 255, 255, 0.8)');
            gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
            
            ctx.beginPath();
            ctx.arc(mouse.x, mouse.y, lightRadius, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();
            
            ctx.globalCompositeOperation = 'source-over';
            
            const lightGradient = ctx.createRadialGradient(
                mouse.x, mouse.y, 0,
                mouse.x, mouse.y, lightRadius * 1.5
            );
            lightGradient.addColorStop(0, 'rgba(255, 255, 200, 0.1)');
            lightGradient.addColorStop(1, 'rgba(255, 255, 200, 0)');
            
            ctx.beginPath();
            ctx.arc(mouse.x, mouse.y, lightRadius * 1.5, 0, Math.PI * 2);
            ctx.fillStyle = lightGradient;
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(mouse.x, mouse.y, 5, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 200, 0.8)';
            ctx.fill();
        }
        
        function animate() {
            drawSpotlight();
            requestAnimationFrame(animate);
        }
        
        canvas.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        });

        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        });
        
        window.addEventListener('resize', resize);
        resize();
        animate();
    </script>
</body>
</html>
