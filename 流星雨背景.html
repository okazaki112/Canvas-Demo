<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流星雨背景</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            background: #000;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        canvas { display: block; }
        .info {
            position: fixed;
            top: 20px;
            left: 20px;
            color: rgba(255,255,255,0.7);
            font-size: 14px;
            pointer-events: none;
            z-index: 10;
        }
        .info h1 { font-size: 18px; margin-bottom: 8px; color: #fff; }
    </style>
</head>
<body>
    <div class="info">
        <h1>流星雨背景</h1>
        <p>点击屏幕生成烟花爆炸</p>
    </div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let meteors = [];
        let stars = [];
        let fireworks = [];
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initStars();
        }
        
        class Star {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2 + 0.5;
                this.alpha = Math.random();
                this.twinkleSpeed = Math.random() * 0.02 + 0.01;
                this.connections = [];
            }

            update() {
                this.alpha += this.twinkleSpeed;
                if (this.alpha > 1 || this.alpha < 0.2) {
                    this.twinkleSpeed = -this.twinkleSpeed;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.fill();

                const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 4);
                gradient.addColorStop(0, `rgba(255, 255, 255, ${this.alpha * 0.3})`);
                gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 4, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();
            }
        }

        function drawConstellations() {
            const maxDist = 120;
            const maxConnections = 3;

            for (let i = 0; i < stars.length; i++) {
                let connections = 0;
                for (let j = i + 1; j < stars.length && connections < maxConnections; j++) {
                    const dx = stars[i].x - stars[j].x;
                    const dy = stars[i].y - stars[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < maxDist) {
                        const alpha = (1 - dist / maxDist) * 0.3 * stars[i].alpha * stars[j].alpha;
                        ctx.beginPath();
                        ctx.moveTo(stars[i].x, stars[i].y);
                        ctx.lineTo(stars[j].x, stars[j].y);
                        ctx.strokeStyle = `rgba(150, 200, 255, ${alpha})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                        connections++;
                    }
                }
            }
        }
        
        class Meteor {
            constructor() {
                this.reset();
            }
            
            reset() {
                this.x = Math.random() * width + width * 0.3;
                this.y = -Math.random() * 200;
                this.length = Math.random() * 150 + 50;
                this.speed = Math.random() * 8 + 4;
                this.angle = Math.PI / 4 + (Math.random() - 0.5) * 0.2;
                this.vx = -Math.cos(this.angle) * this.speed;
                this.vy = Math.sin(this.angle) * this.speed;
                this.life = 1;
                this.decay = Math.random() * 0.01 + 0.005;
                this.hue = Math.random() * 60 + 180;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
                
                if (this.life <= 0 || this.x < -this.length || this.y > height + this.length) {
                    this.reset();
                }
            }
            
            draw() {
                const tailX = this.x - this.vx * this.length / this.speed;
                const tailY = this.y - this.vy * this.length / this.speed;
                
                const gradient = ctx.createLinearGradient(this.x, this.y, tailX, tailY);
                gradient.addColorStop(0, `hsla(${this.hue}, 100%, 80%, ${this.life})`);
                gradient.addColorStop(1, `hsla(${this.hue}, 100%, 80%, 0)`);
                
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(tailX, tailY);
                ctx.strokeStyle = gradient;
                ctx.lineWidth = 2;
                ctx.stroke();
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${this.hue}, 100%, 90%, ${this.life})`;
                ctx.fill();
            }
        }
        
        class Firework {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.particles = [];
                const count = Math.random() * 50 + 50;
                const hue = Math.random() * 360;
                
                for (let i = 0; i < count; i++) {
                    const angle = (Math.PI * 2 / count) * i + Math.random() * 0.5;
                    const speed = Math.random() * 5 + 2;
                    this.particles.push({
                        x: x,
                        y: y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        life: 1,
                        decay: Math.random() * 0.02 + 0.01,
                        hue: hue + Math.random() * 30,
                        size: Math.random() * 3 + 1
                    });
                }
            }
            
            update() {
                for (let p of this.particles) {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.05;
                    p.vx *= 0.98;
                    p.life -= p.decay;
                }
                this.particles = this.particles.filter(p => p.life > 0);
            }
            
            draw() {
                for (let p of this.particles) {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(${p.hue}, 100%, 60%, ${p.life})`;
                    ctx.fill();
                }
            }
            
            isDead() {
                return this.particles.length === 0;
            }
        }
        
        function initStars() {
            stars = [];
            for (let i = 0; i < 200; i++) {
                stars.push(new Star());
            }
        }
        
        function initMeteors() {
            meteors = [];
            for (let i = 0; i < 8; i++) {
                const m = new Meteor();
                m.y = Math.random() * height;
                m.x = Math.random() * width + width * 0.2;
                meteors.push(m);
            }
        }
        
        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(0, 0, width, height);

            drawConstellations();

            for (let s of stars) {
                s.update();
                s.draw();
            }

            for (let m of meteors) {
                m.update();
                m.draw();
            }

            for (let f of fireworks) {
                f.update();
                f.draw();
            }
            fireworks = fireworks.filter(f => !f.isDead());

            requestAnimationFrame(animate);
        }
        
        canvas.addEventListener('click', e => {
            fireworks.push(new Firework(e.clientX, e.clientY));
        });
        
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            fireworks.push(new Firework(e.touches[0].clientX, e.touches[0].clientY));
        });
        
        window.addEventListener('resize', resize);
        resize();
        initMeteors();
        animate();
    </script>
</body>
</html>
