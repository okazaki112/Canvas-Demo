<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>像素液化</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            background: #0a0a0a;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        canvas { display: block; }
        .controls {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10;
            display: flex;
            gap: 10px;
        }
        .controls input[type="file"] { display: none; }
        .controls label, .controls button {
            padding: 10px 20px;
            border: 2px solid #333;
            background: rgba(0,0,0,0.8);
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .controls label:hover, .controls button:hover { border-color: #00d4ff; }
        .info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="controls">
        <label for="imageInput">上传图片</label>
        <input type="file" id="imageInput" accept="image/*">
        <button onclick="resetImage()">重置</button>
    </div>
    <div class="info">鼠标经过图片区域像素被拉扯变形，移开缓慢复原</div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const imageInput = document.getElementById('imageInput');
        
        let width, height;
        let originalImage = null;
        let pixelGrid = [];
        let mouse = { x: -1000, y: -1000 };
        const GRID_SIZE = 10;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            if (originalImage) {
                initPixelGrid();
            } else {
                drawDefaultPattern();
            }
        }
        
        function drawDefaultPattern() {
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, width, height);
            
            for (let x = 0; x < width; x += GRID_SIZE) {
                for (let y = 0; y < height; y += GRID_SIZE) {
                    const hue = (x / width * 360 + y / height * 60) % 360;
                    ctx.fillStyle = `hsl(${hue}, 70%, 50%)`;
                    ctx.fillRect(x, y, GRID_SIZE - 1, GRID_SIZE - 1);
                }
            }
            
            const patternCanvas = document.createElement('canvas');
            patternCanvas.width = width;
            patternCanvas.height = height;
            patternCanvas.getContext('2d').drawImage(canvas, 0, 0);
            originalImage = patternCanvas;
            initPixelGrid();
        }
        
        function initPixelGrid() {
            pixelGrid = [];
            const cols = Math.ceil(width / GRID_SIZE);
            const rows = Math.ceil(height / GRID_SIZE);
            
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    pixelGrid.push({
                        originX: x * GRID_SIZE,
                        originY: y * GRID_SIZE,
                        x: x * GRID_SIZE,
                        y: y * GRID_SIZE,
                        vx: 0,
                        vy: 0
                    });
                }
            }
        }
        
        function loadImage(file) {
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    ctx.clearRect(0, 0, width, height);
                    const scale = Math.min(width / img.width, height / img.height);
                    const w = img.width * scale;
                    const h = img.height * scale;
                    const x = (width - w) / 2;
                    const y = (height - h) / 2;
                    ctx.drawImage(img, x, y, w, h);
                    
                    const patternCanvas = document.createElement('canvas');
                    patternCanvas.width = width;
                    patternCanvas.height = height;
                    patternCanvas.getContext('2d').drawImage(canvas, 0, 0);
                    originalImage = patternCanvas;
                    initPixelGrid();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
        
        function animate() {
            if (!originalImage) {
                requestAnimationFrame(animate);
                return;
            }
            
            ctx.clearRect(0, 0, width, height);
            
            for (let pixel of pixelGrid) {
                const dx = mouse.x - pixel.originX;
                const dy = mouse.y - pixel.originY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < 150) {
                    const force = (150 - dist) / 150;
                    const angle = Math.atan2(dy, dx);
                    pixel.vx += Math.cos(angle) * force * 2;
                    pixel.vy += Math.sin(angle) * force * 2;
                }
                
                pixel.vx += (pixel.originX - pixel.x) * 0.05;
                pixel.vy += (pixel.originY - pixel.y) * 0.05;
                pixel.vx *= 0.9;
                pixel.vy *= 0.9;
                
                pixel.x += pixel.vx;
                pixel.y += pixel.vy;
                
                ctx.drawImage(
                    originalImage,
                    pixel.originX, pixel.originY, GRID_SIZE, GRID_SIZE,
                    pixel.x, pixel.y, GRID_SIZE, GRID_SIZE
                );
            }
            
            requestAnimationFrame(animate);
        }
        
        canvas.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        
        canvas.addEventListener('mouseleave', () => {
            mouse.x = -1000;
            mouse.y = -1000;
        });
        
        imageInput.addEventListener('change', e => {
            const file = e.target.files[0];
            if (file) loadImage(file);
        });
        
        function resetImage() {
            if (originalImage) {
                initPixelGrid();
            }
        }
        
        window.addEventListener('resize', resize);
        resize();
        animate();
    </script>
</body>
</html>
