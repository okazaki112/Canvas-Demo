<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全息线框3D卡片</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            background: #000;
            font-family: 'Microsoft YaHei', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        canvas { display: block; }
        .info {
            position: fixed;
            top: 20px;
            left: 20px;
            color: rgba(255,255,255,0.7);
            font-size: 14px;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="info">
        <h1>全息线框3D卡片</h1>
        <p>移动鼠标倾斜旋转卡片</p>
    </div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let mouse = { x: 0, y: 0 };
        let rotation = { x: 0, y: 0 };
        let targetRotation = { x: 0, y: 0 };
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        
        const vertices = [
            { x: -150, y: -200, z: -20 },
            { x: 150, y: -200, z: -20 },
            { x: 150, y: 200, z: -20 },
            { x: -150, y: 200, z: -20 },
            { x: -150, y: -200, z: 20 },
            { x: 150, y: -200, z: 20 },
            { x: 150, y: 200, z: 20 },
            { x: -150, y: 200, z: 20 }
        ];
        
        const edges = [
            [0, 1], [1, 2], [2, 3], [3, 0],
            [4, 5], [5, 6], [6, 7], [7, 4],
            [0, 4], [1, 5], [2, 6], [3, 7]
        ];
        
        const innerVertices = [
            { x: -130, y: -180, z: -20 },
            { x: 130, y: -180, z: -20 },
            { x: 130, y: 180, z: -20 },
            { x: -130, y: 180, z: -20 }
        ];
        
        function rotateX(point, angle) {
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);
            return {
                x: point.x,
                y: point.y * cos - point.z * sin,
                z: point.y * sin + point.z * cos
            };
        }
        
        function rotateY(point, angle) {
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);
            return {
                x: point.x * cos + point.z * sin,
                y: point.y,
                z: -point.x * sin + point.z * cos
            };
        }
        
        function project(point) {
            const fov = 800;
            const distance = 400;
            const scale = fov / (distance + point.z);
            return {
                x: point.x * scale + width / 2,
                y: point.y * scale + height / 2,
                scale: scale
            };
        }
        
        function drawHologramCard() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(0, 0, width, height);
            
            rotation.x += (targetRotation.x - rotation.x) * 0.1;
            rotation.y += (targetRotation.y - rotation.y) * 0.1;
            
            const transformedVertices = vertices.map(v => {
                let p = rotateX(v, rotation.x);
                p = rotateY(p, rotation.y);
                return project(p);
            });
            
            const transformedInner = innerVertices.map(v => {
                let p = rotateX(v, rotation.x);
                p = rotateY(p, rotation.y);
                return project(p);
            });
            
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.8)';
            ctx.lineWidth = 2;
            ctx.shadowBlur = 15;
            ctx.shadowColor = 'rgba(0, 255, 255, 0.8)';
            
            for (let edge of edges) {
                const v1 = transformedVertices[edge[0]];
                const v2 = transformedVertices[edge[1]];
                ctx.beginPath();
                ctx.moveTo(v1.x, v1.y);
                ctx.lineTo(v2.x, v2.y);
                ctx.stroke();
            }
            
            ctx.strokeStyle = 'rgba(255, 0, 255, 0.6)';
            ctx.lineWidth = 1;
            ctx.shadowColor = 'rgba(255, 0, 255, 0.6)';
            
            for (let i = 0; i < transformedInner.length; i++) {
                const v1 = transformedInner[i];
                const v2 = transformedInner[(i + 1) % transformedInner.length];
                ctx.beginPath();
                ctx.moveTo(v1.x, v1.y);
                ctx.lineTo(v2.x, v2.y);
                ctx.stroke();
            }
            
            ctx.fillStyle = 'rgba(0, 255, 255, 0.1)';
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.moveTo(transformedVertices[0].x, transformedVertices[0].y);
            for (let i = 1; i < 4; i++) {
                ctx.lineTo(transformedVertices[i].x, transformedVertices[i].y);
            }
            ctx.closePath();
            ctx.fill();
            
            ctx.fillStyle = 'rgba(0, 255, 255, 0.9)';
            ctx.font = 'bold 24px Microsoft YaHei';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'rgba(0, 255, 255, 0.8)';
            ctx.fillText('HOLOGRAM', width / 2, height / 2 - 20);
            ctx.font = '16px Microsoft YaHei';
            ctx.fillStyle = 'rgba(255, 0, 255, 0.9)';
            ctx.shadowColor = 'rgba(255, 0, 255, 0.8)';
            ctx.fillText('3D CARD', width / 2, height / 2 + 20);
            ctx.shadowBlur = 0;
            
            const scanLineY = (Date.now() % 3000) / 3000 * height;
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.3)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, scanLineY);
            ctx.lineTo(width, scanLineY);
            ctx.stroke();

            const glitchChance = 0.02;
            if (Math.random() < glitchChance) {
                const glitchY = Math.random() * height;
                const glitchHeight = Math.random() * 30 + 10;
                ctx.fillStyle = 'rgba(0, 255, 255, 0.1)';
                ctx.fillRect(0, glitchY, width, glitchHeight);

                ctx.fillStyle = 'rgba(255, 0, 255, 0.2)';
                ctx.fillRect(Math.random() * 50 - 25, glitchY, width, glitchHeight);
            }

            const time = Date.now() * 0.001;
            for (let i = 0; i < 3; i++) {
                const y = (time * 100 + i * height / 3) % height;
                ctx.fillStyle = `rgba(0, 255, 255, ${0.05 - i * 0.015})`;
                ctx.fillRect(0, y, width, 2);
            }

            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            for (let y = 0; y < height; y += 4) {
                ctx.fillRect(0, y, width, 1);
            }
        }
        
        function animate() {
            drawHologramCard();
            requestAnimationFrame(animate);
        }
        
        canvas.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            targetRotation.y = ((mouse.x - width / 2) / width) * Math.PI * 0.5;
            targetRotation.x = ((mouse.y - height / 2) / height) * Math.PI * 0.3;
        });
        
        window.addEventListener('resize', resize);
        resize();
        animate();
    </script>
</body>
</html>
