<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海底气泡上升</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #001020;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255,255,255,0.6);
            font-family: Arial, sans-serif;
            font-size: 14px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="info">点击产生气泡群 | 鼠标移动产生水流</div>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let bubbles = [];
        let seaweeds = [];
        let fishes = [];
        let mouseX = 0, mouseY = 0;
        let time = 0;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initSeaweed();
        }
        
        // 海草
        class Seaweed {
            constructor(x) {
                this.x = x;
                this.segments = 8 + Math.floor(Math.random() * 6);
                this.segmentHeight = 25 + Math.random() * 15;
                this.color = `hsl(${120 + Math.random() * 40}, 60%, ${20 + Math.random() * 20}%)`;
                this.offset = Math.random() * Math.PI * 2;
                this.thickness = 8 + Math.random() * 6;
            }
            
            draw() {
                ctx.beginPath();
                ctx.moveTo(this.x, height);
                
                let currentX = this.x;
                let currentY = height;
                
                for (let i = 0; i < this.segments; i++) {
                    const sway = Math.sin(time * 2 + this.offset + i * 0.5) * (i * 2);
                    const nextX = this.x + sway;
                    const nextY = currentY - this.segmentHeight;
                    
                    ctx.quadraticCurveTo(currentX, currentY - this.segmentHeight / 2, nextX, nextY);
                    
                    currentX = nextX;
                    currentY = nextY;
                }
                
                ctx.strokeStyle = this.color;
                ctx.lineWidth = this.thickness;
                ctx.lineCap = 'round';
                ctx.stroke();
            }
        }
        
        // 气泡
        class Bubble {
            constructor(x, y, size = null) {
                this.x = x || Math.random() * width;
                this.y = y || height + 20;
                this.size = size || Math.random() * 8 + 3;
                this.speed = 1 + Math.random() * 2 + (10 - this.size) * 0.3;
                this.wobble = Math.random() * Math.PI * 2;
                this.wobbleSpeed = 0.02 + Math.random() * 0.03;
                this.opacity = 0.3 + Math.random() * 0.4;
            }
            
            update() {
                this.y -= this.speed;
                this.wobble += this.wobbleSpeed;
                this.x += Math.sin(this.wobble) * 0.5;
                
                // 鼠标影响
                const dx = this.x - mouseX;
                const dy = this.y - mouseY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 100) {
                    this.x += dx / dist * 2;
                }
            }
            
            draw() {
                // 气泡主体
                const gradient = ctx.createRadialGradient(
                    this.x - this.size * 0.3, this.y - this.size * 0.3, 0,
                    this.x, this.y, this.size
                );
                gradient.addColorStop(0, `rgba(255, 255, 255, ${this.opacity + 0.2})`);
                gradient.addColorStop(0.5, `rgba(200, 230, 255, ${this.opacity * 0.5})`);
                gradient.addColorStop(1, `rgba(150, 200, 255, ${this.opacity * 0.2})`);
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();
                
                // 边框
                ctx.strokeStyle = `rgba(255, 255, 255, ${this.opacity * 0.6})`;
                ctx.lineWidth = 1;
                ctx.stroke();
                
                // 高光
                ctx.beginPath();
                ctx.arc(this.x - this.size * 0.3, this.y - this.size * 0.3, this.size * 0.25, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity + 0.3})`;
                ctx.fill();
            }
            
            isOffScreen() {
                return this.y < -20;
            }
        }
        
        // 小鱼
        class Fish {
            constructor() {
                this.reset();
            }
            
            reset() {
                this.direction = Math.random() > 0.5 ? 1 : -1;
                this.x = this.direction === 1 ? -50 : width + 50;
                this.y = 100 + Math.random() * (height - 200);
                this.speed = (1 + Math.random() * 2) * this.direction;
                this.size = 15 + Math.random() * 20;
                this.color = `hsl(${Math.random() * 60 + 10}, 80%, 60%)`;
                this.tailPhase = Math.random() * Math.PI * 2;
            }
            
            update() {
                this.x += this.speed;
                this.y += Math.sin(time * 3 + this.tailPhase) * 0.5;
                
                if ((this.direction === 1 && this.x > width + 50) ||
                    (this.direction === -1 && this.x < -50)) {
                    this.reset();
                }
            }
            
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.scale(this.direction, 1);
                
                // 鱼身
                ctx.beginPath();
                ctx.ellipse(0, 0, this.size, this.size * 0.6, 0, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                
                // 鱼尾摆动
                const tailSway = Math.sin(time * 8 + this.tailPhase) * 5;
                ctx.beginPath();
                ctx.moveTo(-this.size * 0.8, 0);
                ctx.lineTo(-this.size * 1.4, -this.size * 0.5 + tailSway);
                ctx.lineTo(-this.size * 1.4, this.size * 0.5 + tailSway);
                ctx.closePath();
                ctx.fillStyle = this.color;
                ctx.fill();
                
                // 眼睛
                ctx.beginPath();
                ctx.arc(this.size * 0.4, -this.size * 0.2, this.size * 0.15, 0, Math.PI * 2);
                ctx.fillStyle = 'white';
                ctx.fill();
                ctx.beginPath();
                ctx.arc(this.size * 0.45, -this.size * 0.2, this.size * 0.08, 0, Math.PI * 2);
                ctx.fillStyle = 'black';
                ctx.fill();
                
                ctx.restore();
            }
        }
        
        function initSeaweed() {
            seaweeds = [];
            for (let x = 30; x < width; x += 60 + Math.random() * 40) {
                seaweeds.push(new Seaweed(x));
            }
        }
        
        function init() {
            resize();
            
            // 初始化气泡
            for (let i = 0; i < 50; i++) {
                bubbles.push(new Bubble());
            }
            
            // 初始化鱼
            for (let i = 0; i < 8; i++) {
                fishes.push(new Fish());
            }
        }
        
        function drawBackground() {
            // 深海渐变
            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, '#001a33');
            gradient.addColorStop(0.5, '#002a4a');
            gradient.addColorStop(1, '#001020');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);
            
            // 光线效果
            for (let i = 0; i < 5; i++) {
                const x = width * (0.2 + i * 0.15);
                const gradient = ctx.createLinearGradient(x, 0, x - 50, height);
                gradient.addColorStop(0, 'rgba(100, 150, 200, 0.1)');
                gradient.addColorStop(1, 'transparent');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x - 30 + Math.sin(time + i) * 10, height);
                ctx.lineTo(x - 80 + Math.sin(time + i) * 10, height);
                ctx.lineTo(x - 50, 0);
                ctx.fill();
            }
        }
        
        function animate() {
            time += 0.016;
            
            drawBackground();
            
            // 绘制海草
            seaweeds.forEach(seaweed => seaweed.draw());
            
            // 更新和绘制鱼
            fishes.forEach(fish => {
                fish.update();
                fish.draw();
            });
            
            // 更新和绘制气泡
            bubbles = bubbles.filter(bubble => {
                bubble.update();
                bubble.draw();
                return !bubble.isOffScreen();
            });
            
            // 随机产生新气泡
            if (Math.random() < 0.05) {
                bubbles.push(new Bubble());
            }
            
            requestAnimationFrame(animate);
        }
        
        window.addEventListener('resize', resize);
        
        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });
        
        window.addEventListener('click', (e) => {
            for (let i = 0; i < 10; i++) {
                bubbles.push(new Bubble(
                    e.clientX + (Math.random() - 0.5) * 50,
                    e.clientY + (Math.random() - 0.5) * 30,
                    Math.random() * 6 + 4
                ));
            }
        });
        
        window.addEventListener('touchmove', (e) => {
            mouseX = e.touches[0].clientX;
            mouseY = e.touches[0].clientY;
        });
        
        window.addEventListener('touchstart', (e) => {
            for (let i = 0; i < 10; i++) {
                bubbles.push(new Bubble(
                    e.touches[0].clientX + (Math.random() - 0.5) * 50,
                    e.touches[0].clientY + (Math.random() - 0.5) * 30,
                    Math.random() * 6 + 4
                ));
            }
        });
        
        init();
        animate();
    </script>
</body>
</html>
